<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · COMMAND CENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  :root {
    --bg: #030308;
    --card: rgba(8, 8, 14, 0.45);
    --card-solid: rgba(12, 12, 22, 0.75);
    --border: rgba(255, 30, 60, 0.25);
    --border-hover: rgba(255, 30, 60, 0.65);
    --red: #ff1e3c;
    --red-2: #ff5570;
    --red-glow: rgba(255, 30, 60, 0.6);
    --text: #ebebf5;
    --text-dim: #70707f;
    --text-mute: #3a3a48;
    --success: #00ff88;
    --cyan: #00e5ff;
    --magenta: #ff00aa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
  }

  /* ============ BACKGROUND ============ */
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255, 30, 60, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 30, 60, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 60px 60px, 60px 60px; }
  }

  .bg-glow {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 30, 60, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(150, 0, 255, 0.1) 0%, transparent 45%);
    z-index: 1;
    pointer-events: none;
    animation: bgPulse 8s ease-in-out infinite;
  }

  @keyframes bgPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  #matrixCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0.35;
  }

  .cursor-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 30, 60, 0.1) 0%, transparent 60%);
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s;
    opacity: 0;
    will-change: transform;
    filter: blur(20px);
  }
  .cursor-glow.active { opacity: 1; }

  .bg-scan {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(255, 30, 60, 0.015) 3px,
      rgba(255, 30, 60, 0.015) 4px
    );
    z-index: 4;
    pointer-events: none;
    opacity: 0.6;
  }

  /* ============ APP CONTAINER ============ */
  #app {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ============ HEADER ============ */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 20px 60px -20px rgba(255, 30, 60, 0.3),
      0 8px 30px -10px rgba(0, 0, 0, 0.6);
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .app-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    animation: headerLine 5s linear infinite;
  }

  @keyframes headerLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .app-logo {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(255, 30, 60, 0.2), rgba(255, 30, 60, 0.05));
    border: 1px solid var(--border);
    font-size: 1.2rem;
    box-shadow: 0 0 20px rgba(255, 30, 60, 0.2);
  }

  .app-title-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .app-title-main {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 15px var(--red-glow);
  }

  .app-title-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(255, 30, 60, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
    transition: all 0.3s;
  }

  .user-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  .user-badge.admin {
    background: rgba(255, 30, 60, 0.2);
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
  }

  .user-badge.admin::before {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .logout-btn:hover {
    background: var(--red);
    color: #000;
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
    transform: translateY(-1px);
  }

  /* ============ ADMIN PANEL ============ */
  .admin-panel {
    display: none;
    margin-bottom: 1.5rem;
    padding: 1.5rem;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 20px 60px -20px rgba(255, 30, 60, 0.2);
    position: relative;
    overflow: hidden;
    animation: panelEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes panelEnter {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .admin-panel.active { display: block; }

  .admin-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    animation: headerLine 5s linear infinite;
  }

  .admin-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255, 30, 60, 0.15);
  }

  .admin-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: rgba(255, 30, 60, 0.15);
    border: 1px solid var(--border);
    font-size: 1rem;
  }

  .admin-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
  }

  .admin-grid {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .admin-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .admin-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .admin-field label::before {
    content: '›';
    color: var(--red);
    font-weight: 700;
  }

  .admin-field input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid rgba(255, 30, 60, 0.15);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: all 0.25s;
  }

  .admin-field input:focus {
    border-color: var(--border-hover);
    background: rgba(12, 5, 12, 0.8);
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08), 0 0 20px rgba(255, 30, 60, 0.15);
  }

  .admin-field input::placeholder {
    color: var(--text-mute);
    font-weight: 300;
  }

  .emoji-input { text-align: center; font-size: 1.2rem !important; }

  .admin-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .btn-add {
    padding: 0.75rem 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff1e3c 0%, #cc0022 50%, #ff1e3c 100%);
    background-size: 200% 200%;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(255, 30, 60, 0.4);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    animation: btnGradient 4s ease infinite;
    position: relative;
    overflow: hidden;
  }

  @keyframes btnGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .btn-add::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    transition: transform 0.7s;
  }

  .btn-add:hover::before { transform: translateX(100%); }

  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255, 30, 60, 0.55);
  }

  .btn-add:disabled {
    opacity: 0.5;
    cursor: wait;
    transform: none;
    animation: none;
  }

  .admin-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-mute);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .admin-hint::before {
    content: 'ℹ';
    color: var(--red);
  }

  /* ============ SECTIONS GRID ============ */
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .section-card {
    position: relative;
    padding: 2rem 1.25rem 1.5rem;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    color: inherit;
    display: block;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 10px 30px -10px rgba(0, 0, 0, 0.6);
    animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  .section-card:nth-child(1) { animation-delay: 0.05s; }
  .section-card:nth-child(2) { animation-delay: 0.1s; }
  .section-card:nth-child(3) { animation-delay: 0.15s; }
  .section-card:nth-child(4) { animation-delay: 0.2s; }
  .section-card:nth-child(5) { animation-delay: 0.25s; }
  .section-card:nth-child(6) { animation-delay: 0.3s; }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(15px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .section-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .section-card:hover::before { opacity: 1; }

  .section-card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover);
    box-shadow:
      0 0 0 1px rgba(255, 30, 60, 0.15) inset,
      0 20px 50px -15px rgba(255, 30, 60, 0.4),
      0 0 60px rgba(255, 30, 60, 0.15);
  }

  /* Corner brackets on hover */
  .section-card::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid transparent;
    border-radius: 10px;
    pointer-events: none;
    transition: border-color 0.3s;
  }

  .section-card:hover::after {
    border-color: rgba(255, 30, 60, 0.15);
  }

  .section-icon {
    font-size: 2.75rem;
    margin-bottom: 0.85rem;
    display: block;
    filter: drop-shadow(0 0 15px rgba(255, 30, 60, 0.5));
    transition: transform 0.3s;
  }

  .section-card:hover .section-icon {
    transform: scale(1.15);
  }

  .section-name {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.4rem;
    text-shadow: 0 0 10px rgba(255, 30, 60, 0.3);
  }

  .section-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Empty section */
  .section-card.empty {
    border-style: dashed;
    opacity: 0.55;
    cursor: not-allowed;
  }

  .section-card.empty:hover {
    transform: none;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
  }

  .section-card.empty .section-name { color: var(--text-dim); }
  .section-card.empty .section-desc { color: var(--text-mute); font-style: italic; }
  .section-card.empty .section-icon { filter: none; opacity: 0.5; }

  /* Delete button */
  .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.7rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: all 0.2s;
    padding: 0;
    backdrop-filter: blur(10px);
  }

  .section-card:hover .delete-btn.admin-visible { display: flex; }

  .delete-btn:hover {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
    box-shadow: 0 0 15px rgba(255, 30, 60, 0.6);
  }

  /* ============ SUSPENDED SCREEN ============ */
  .suspended-screen {
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 2rem;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 2px solid var(--red);
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    animation: suspendPulse 2s ease-in-out infinite;
  }

  @keyframes suspendPulse {
    0%, 100% {
      box-shadow: 0 0 60px rgba(255, 30, 60, 0.5), inset 0 0 40px rgba(255, 30, 60, 0.1);
    }
    50% {
      box-shadow: 0 0 100px rgba(255, 30, 60, 0.9), inset 0 0 60px rgba(255, 30, 60, 0.2);
    }
  }

  .suspended-icon {
    font-size: 5rem;
    margin-bottom: 1rem;
    display: block;
    filter: drop-shadow(0 0 30px var(--red));
    animation: suspendIcon 3s ease-in-out infinite;
  }

  @keyframes suspendIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .suspended-title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 1rem;
    text-shadow: 0 0 20px var(--red), 0 0 40px rgba(255, 30, 60, 0.5);
    animation: titleGlitchSuspend 4s infinite;
  }

  @keyframes titleGlitchSuspend {
    0%, 88%, 100% { transform: translate(0); }
    90% { transform: translate(-2px, 1px); }
    92% { transform: translate(2px, -1px); }
    94% { transform: translate(-1px, 0); }
  }

  .suspended-desc {
    font-size: 1rem;
    color: var(--text);
    letter-spacing: 2px;
    margin-bottom: 2rem;
    line-height: 1.7;
  }

  .suspended-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .suspended-footer {
    border-top: 1px solid rgba(255, 30, 60, 0.2);
    padding-top: 1.5rem;
    margin-top: 2rem;
  }

  .suspended-footer p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-mute);
    letter-spacing: 2px;
    margin-bottom: 1.25rem;
    text-transform: uppercase;
    line-height: 1.7;
  }

  .suspended-footer .en {
    display: block;
    font-size: 0.65rem;
    color: rgba(255, 30, 60, 0.3);
    margin-top: 0.4rem;
  }

  .exit-btn {
    padding: 0.85rem 2.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .exit-btn:hover {
    background: var(--red);
    color: #000;
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.8);
    transform: translateY(-2px);
  }

  /* ============ MOBILE ============ */
  @media (max-width: 768px) {
    .admin-grid {
      grid-template-columns: 80px 1fr;
    }
    .admin-grid .admin-field:nth-child(n+3) {
      grid-column: span 1;
    }
  }

  @media (max-width: 480px) {
    body { padding: 0.85rem; }
    .app-header { padding: 0.85rem 1rem; }
    .app-title-main { font-size: 0.85rem; letter-spacing: 3px; }
    .section-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
    .section-card { padding: 1.5rem 1rem 1.25rem; }
    .section-icon { font-size: 2.25rem; }
    .section-name { font-size: 0.8rem; letter-spacing: 2px; }
    .suspended-title { font-size: 1.4rem; letter-spacing: 5px; }
    .suspended-icon { font-size: 3.5rem; }
    .admin-grid { grid-template-columns: 1fr; }
    .cursor-glow { display: none; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<canvas id="matrixCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="bg-scan"></div>

<div id="app">
  <div class="app-header">
    <div class="app-title">
      <div class="app-logo">◈</div>
      <div class="app-title-text">
        <div class="app-title-main">ABYSS</div>
        <div class="app-title-sub">Command Center</div>
      </div>
    </div>
    <div class="user-info">
      <div class="user-badge" id="userBadge">—</div>
      <button class="logout-btn" id="logoutBtn">⏻ Exit</button>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <div class="admin-icon">➕</div>
      <div class="admin-title">Add New Section</div>
    </div>

    <div class="admin-grid">
      <div class="admin-field">
        <label>Icon</label>
        <input type="text" class="emoji-input" id="newIcon" value="🔷" maxlength="4">
      </div>
      <div class="admin-field">
        <label>Name</label>
        <input type="text" id="newName" placeholder="e.g. Games" maxlength="20" autocomplete="off">
      </div>
      <div class="admin-field">
        <label>Description</label>
        <input type="text" id="newDesc" placeholder="short description" maxlength="40" autocomplete="off">
      </div>
      <div class="admin-field">
        <label>URL (optional)</label>
        <input type="text" id="newUrl" placeholder="games.html" maxlength="60" autocomplete="off">
      </div>
    </div>

    <div class="admin-actions">
      <button class="btn-add" id="addSectionBtn">
        <span>▸</span>
        <span>Add Section</span>
      </button>
    </div>

    <div class="admin-hint">
      Leave URL empty to add a placeholder — you can edit the HTML later.
    </div>
  </div>

  <div class="section-grid" id="sectionGrid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  deleteDoc, doc, query, orderBy, getDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

/* ============ CURSOR GLOW ============ */
const cursorGlow = document.getElementById('cursorGlow');
let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;

document.addEventListener('mousemove', function(e){
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursorGlow.classList.add('active');
});
document.addEventListener('mouseleave', function(){
  cursorGlow.classList.remove('active');
});

function animateGlow(){
  glowX += (mouseX - glowX) * 0.08;
  glowY += (mouseY - glowY) * 0.08;
  cursorGlow.style.left = glowX + 'px';
  cursorGlow.style.top = glowY + 'px';
  requestAnimationFrame(animateGlow);
}
animateGlow();

/* ============ MATRIX RAIN ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
function resizeMC(){ mc.width = innerWidth; mc.height = innerHeight; }
resizeMC(); addEventListener('resize', resizeMC);

const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';
const matrixFontSize = 16;
let matrixCols = Math.floor(mc.width / matrixFontSize);
let matrixDrops = Array(matrixCols).fill(1);

addEventListener('resize', function(){
  matrixCols = Math.floor(mc.width / matrixFontSize);
  matrixDrops = Array(matrixCols).fill(1);
});

function drawMatrix(){
  mctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
  mctx.fillRect(0, 0, mc.width, mc.height);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    if (Math.random() > 0.975){
      mctx.fillStyle = '#ffffff';
      mctx.shadowBlur = 15;
      mctx.shadowColor = '#ff1e3c';
    } else {
      mctx.fillStyle = '#ff1e3c';
      mctx.shadowBlur = 0;
    }

    mctx.fillText(text, x, y);

    if (y > mc.height && Math.random() > 0.975){
      matrixDrops[i] = 0;
    }
    matrixDrops[i]++;
  }
  mctx.shadowBlur = 0;
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

/* ============ AUTH ============ */
let currentUser = null;
let isAdmin = false;
let isSuspendedScreen = false;

onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  let stored = sessionStorage.getItem('abyss_user');
  if (!stored && user.email){
    const emailUser = user.email.split('@')[0];
    stored = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }
  currentUser = stored || 'unknown';
  isAdmin = (currentUser.toLowerCase() === ADMIN_USER.toLowerCase());

  const badge = document.getElementById('userBadge');
  badge.textContent = currentUser + (isAdmin ? ' ★' : '');
  if (isAdmin) badge.classList.add('admin');

  const adminPanel = document.getElementById('adminPanel');
  if (isAdmin){
    adminPanel.classList.add('active');
  }

  await renderSections();
  watchSettings();
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ LIVE WATCH: suspension & lock ============ */
function watchSettings(){
  const settingsRef = doc(db, 'settings', 'global');
  onSnapshot(settingsRef, function(snap){
    if (!snap.exists()) return;
    const data = snap.data();

    if (isAdmin) return;

    const suspended = data.suspended || [];
    const locked = data.locked === true;

    if (suspended.indexOf(currentUser) !== -1){
      showSuspendedScreen('suspended');
      return;
    }
    if (locked){
      showSuspendedScreen('locked');
      return;
    }

    if (isSuspendedScreen){
      isSuspendedScreen = false;
      location.reload();
    }
  });
}

function showSuspendedScreen(reason){
  if (isSuspendedScreen) return;
  isSuspendedScreen = true;

  const grid = document.getElementById('sectionGrid');
  const adminPanel = document.getElementById('adminPanel');
  adminPanel.classList.remove('active');

  const title = reason === 'locked' ? 'LOCKED' : 'SUSPENDED';
  const icon = reason === 'locked' ? '⛓' : '🚫';
  const desc = reason === 'locked'
    ? 'ABYSS HAS BEEN SEALED<br><span class="suspended-sub">By The Creator</span>'
    : 'Your account has been suspended<br><span class="suspended-sub">By The Creator</span>';

  grid.innerHTML = `
    <div class="suspended-screen">
      <div class="suspended-icon">${icon}</div>
      <h1 class="suspended-title">${title}</h1>
      <p class="suspended-desc">${desc}</p>
      <div class="suspended-footer">
        <p>
          There is no point in trying again
          <span class="en">Access Revoked Permanently</span>
        </p>
        <button class="exit-btn" id="suspendExit">⏻ Exit</button>
      </div>
    </div>
  `;

  document.getElementById('suspendExit').addEventListener('click', async function(){
    sessionStorage.clear();
    await signOut(auth);
    window.location.href = 'index.html';
  });
}

/* ============ SECTIONS ============ */
const DEFAULT_SECTIONS = [
  { name: 'Chat',  icon: '💬', desc: 'General chat',  url: 'chat.html',    default: true, order: 1 },
  { name: 'Files', icon: '📁', desc: 'Image vault',   url: 'files.html',   default: true, order: 2 },
  { name: 'Names', icon: '👤', desc: 'Account registry', url: 'accounts.html', default: true, order: 3 }
];
const ADMIN_SECTION = { name: 'Commands', icon: '🔒', desc: 'Admin center', url: 'admin.html', default: true, order: 99 };

async function renderSections(){
  const grid = document.getElementById('sectionGrid');
  grid.innerHTML = '';

  let custom = [];
  try {
    const snap = await getDocs(query(collection(db, 'sections'), orderBy('order', 'asc')));
    snap.forEach(function(d){
      custom.push(Object.assign({ id: d.id }, d.data()));
    });
  } catch (e){
    console.error('Failed to load custom sections:', e);
  }

  const sections = DEFAULT_SECTIONS.slice();
  custom.forEach(function(c){
    sections.push(Object.assign({ default: false }, c));
  });

  sections.sort(function(a, b){
    return (a.order || 50) - (b.order || 50);
  });

  sections.push(ADMIN_SECTION);

  sections.forEach(function(s){
    const hasUrl = s.url && s.url.trim() !== '';
    const card = document.createElement('a');
    card.className = 'section-card';
    if (!hasUrl) card.classList.add('empty');

    if (hasUrl){
      card.href = s.url;
    } else {
      card.href = 'javascript:void(0)';
      card.style.cursor = 'not-allowed';
    }

    card.innerHTML =
      '<span class="section-icon">' + (s.icon || '🔷') + '</span>' +
      '<div class="section-name">' + escapeHtml(s.name || 'Untitled') + '</div>' +
      '<div class="section-desc">' + escapeHtml(s.desc || (hasUrl ? '' : 'Awaiting setup')) + '</div>';

    if (isAdmin && !s.default && s.id){
      const del = document.createElement('button');
      del.className = 'delete-btn admin-visible';
      del.textContent = '✕';
      del.title = 'Delete section';
      del.addEventListener('click', async function(e){
        e.preventDefault();
        e.stopPropagation();
        if (!confirm('Delete section "' + s.name + '"?')) return;
        try {
          await deleteDoc(doc(db, 'sections', s.id));
          await renderSections();
        } catch(err){
          console.error(err);
          alert('Failed to delete: ' + err.message);
        }
      });
      card.appendChild(del);
    }

    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ============ ADD SECTION ============ */
document.getElementById('addSectionBtn').addEventListener('click', async function(){
  if (!isAdmin) return;

  const icon = document.getElementById('newIcon').value.trim() || '🔷';
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const url  = document.getElementById('newUrl').value.trim();

  if (!name){
    alert('⚠ Section name is required');
    return;
  }

  const btn = this;
  btn.disabled = true;
  btn.innerHTML = '<span>◈</span><span>Adding...</span>';

  try {
    const snap = await getDocs(collection(db, 'sections'));
    let maxOrder = 10;
    snap.forEach(function(d){
      const o = d.data().order || 0;
      if (o > maxOrder) maxOrder = o;
    });

    await addDoc(collection(db, 'sections'), {
      icon: icon,
      name: name,
      desc: desc,
      url: url,
      order: maxOrder + 10,
      owner: currentUser,
      createdAt: Date.now()
    });

    document.getElementById('newIcon').value = '🔷';
    document.getElementById('newName').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newUrl').value = '';

    await renderSections();
  } catch (e){
    console.error(e);
    alert('Failed to add section: ' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '<span>▸</span><span>Add Section</span>';
});
</script>
</body>
</html>
