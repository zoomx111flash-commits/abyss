<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · COMMAND CENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- ✅ تحميل الثيم واللغة أولاً -->
<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  body {
    background: var(--bg, #030308);
    color: var(--text, #ebebf5);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    transition: background 0.4s, color 0.4s;
    background-image:
      radial-gradient(circle at 15% 20%, var(--primary-glow, rgba(255,30,60,0.12)) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--primary-glow, rgba(255,30,60,0.08)) 0%, transparent 45%);
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px),
      linear-gradient(90deg, var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.6;
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  .cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary-glow, rgba(255,30,60,0.08)) 0%, transparent 60%);
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    opacity: 0;
    filter: blur(30px);
    will-change: transform;
  }
  .cursor-glow.active { opacity: 1; }

  #app {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ============ HEADER ============ */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.3));
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .app-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .app-logo {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(255, 30, 60, 0.2), rgba(255, 30, 60, 0.05));
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    font-size: 1.2rem;
    box-shadow: 0 0 20px var(--primary-glow, rgba(255,30,60,0.2));
    color: var(--primary, #ff1e3c);
  }

  .app-title-text { display: flex; flex-direction: column; line-height: 1.2; }

  .app-title-main {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
    text-shadow: 0 0 15px var(--primary-glow, rgba(255,30,60,0.6));
  }

  .app-title-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--text-dim, #70707f);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: rgba(255, 30, 60, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
  }

  .user-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary, #ff1e3c);
    box-shadow: 0 0 8px var(--primary, #ff1e3c);
  }

  .user-badge.admin {
    background: rgba(255, 30, 60, 0.2);
    border-color: var(--primary, #ff1e3c);
  }

  .user-badge.admin::before {
    background: var(--success, #00ff88);
    box-shadow: 0 0 8px var(--success, #00ff88);
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.25s;
    text-decoration: none;
  }
  .icon-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
    transform: translateY(-2px);
  }

  .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .logout-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
  }

  /* ============ QUICK ACTIONS BAR ============ */
  .quick-bar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .quick-btn {
    padding: 0.65rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    background: transparent;
    color: var(--text, #ebebf5);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.25s;
    position: relative;
    font-weight: 600;
  }
  .quick-btn:hover {
    background: rgba(255, 30, 60, 0.1);
    border-color: var(--primary, #ff1e3c);
    transform: translateY(-2px);
  }
  .quick-btn .q-ico { font-size: 1rem; }

  .quick-btn .q-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--primary, #ff1e3c);
    color: #000;
    font-size: 0.6rem;
    font-weight: 900;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px var(--primary-glow, rgba(255,30,60,0.6));
    animation: pulseBadge 2s infinite;
  }
  @keyframes pulseBadge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* ============ ADMIN PANEL ============ */
  .admin-panel {
    display: none;
    margin-bottom: 1.5rem;
    padding: 1.5rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }
  .admin-panel.active { display: block; }

  .admin-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
    animation: topLine 5s linear infinite;
  }

  .admin-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
  }

  .admin-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: rgba(255, 30, 60, 0.15);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    font-size: 1rem;
    color: var(--primary, #ff1e3c);
  }

  .admin-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    font-weight: 700;
  }

  .admin-grid {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .admin-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .admin-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim, #70707f);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .admin-field label::before {
    content: '›';
    color: var(--primary, #ff1e3c);
    font-weight: 700;
  }

  .admin-field input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.15));
    border-radius: 10px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: all 0.25s;
  }

  .admin-field input:focus {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08);
  }

  .emoji-input { text-align: center; font-size: 1.2rem !important; }

  .admin-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .btn-add {
    padding: 0.75rem 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary, #ff1e3c) 0%, var(--primary-2, #cc0022) 100%);
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px var(--primary-glow, rgba(255,30,60,0.4));
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--primary-glow, rgba(255,30,60,0.55));
  }

  .btn-add:disabled {
    opacity: 0.5;
    cursor: wait;
    transform: none;
  }

  .admin-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-mute, #3a3a48);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .admin-hint::before {
    content: 'ℹ';
    color: var(--primary, #ff1e3c);
  }

  /* ============ SECTIONS GRID ============ */
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .section-card {
    position: relative;
    padding: 2rem 1.25rem 1.5rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    color: inherit;
    display: block;
    overflow: hidden;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
  }

  .section-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .section-card:hover::before { opacity: 1; }

  .section-card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    box-shadow: 0 20px 50px -15px var(--primary-glow, rgba(255,30,60,0.4));
  }

  .section-icon {
    font-size: 2.75rem;
    margin-bottom: 0.85rem;
    display: block;
    filter: drop-shadow(0 0 15px var(--primary-glow, rgba(255,30,60,0.5)));
    transition: transform 0.3s;
  }

  .section-card:hover .section-icon {
    transform: scale(1.15);
  }

  .section-name {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
    margin-bottom: 0.4rem;
    text-shadow: 0 0 10px var(--primary-glow, rgba(255,30,60,0.3));
  }

  .section-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 1px;
    color: var(--text-dim, #70707f);
    text-transform: uppercase;
  }

  .section-card.empty {
    border-style: dashed;
    opacity: 0.55;
    cursor: not-allowed;
  }

  .section-card.empty:hover { transform: none; }
  .section-card.empty .section-name { color: var(--text-dim, #70707f); }
  .section-card.empty .section-desc { color: var(--text-mute, #3a3a48); font-style: italic; }
  .section-card.empty .section-icon { filter: none; opacity: 0.5; }

  .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--text-dim, #70707f);
    font-size: 0.7rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: all 0.2s;
    padding: 0;
  }

  .section-card:hover .delete-btn.admin-visible { display: flex; }
  .delete-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #fff;
    border-color: var(--primary, #ff1e3c);
  }

  /* ============ SUSPENDED SCREEN ============ */
  .suspended-screen {
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 2rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    border: 2px solid var(--primary, #ff1e3c);
    border-radius: 20px;
    animation: suspendPulse 2s ease-in-out infinite;
  }

  @keyframes suspendPulse {
    0%, 100% { box-shadow: 0 0 60px var(--primary-glow, rgba(255,30,60,0.5)); }
    50% { box-shadow: 0 0 100px var(--primary-glow, rgba(255,30,60,0.9)); }
  }

  .suspended-icon {
    font-size: 5rem;
    margin-bottom: 1rem;
    display: block;
    filter: drop-shadow(0 0 30px var(--primary, #ff1e3c));
  }

  .suspended-title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    margin-bottom: 1rem;
    text-shadow: 0 0 20px var(--primary, #ff1e3c);
  }

  .suspended-desc {
    font-size: 1rem;
    color: var(--text, #ebebf5);
    letter-spacing: 2px;
    margin-bottom: 2rem;
    line-height: 1.7;
  }

  .suspended-footer {
    border-top: 1px solid var(--border, rgba(255,30,60,0.2));
    padding-top: 1.5rem;
    margin-top: 2rem;
  }

  .suspended-footer p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-mute, #3a3a48);
    letter-spacing: 2px;
    margin-bottom: 1.25rem;
    text-transform: uppercase;
  }

  .exit-btn {
    padding: 0.85rem 2.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--primary, #ff1e3c);
    color: var(--primary, #ff1e3c);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .exit-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    box-shadow: 0 0 30px var(--primary-glow, rgba(255,30,60,0.8));
  }

  /* ============ MOBILE ============ */
  @media (max-width: 768px) {
    .admin-grid {
      grid-template-columns: 80px 1fr;
    }
  }

  @media (max-width: 480px) {
    body { padding: 0.85rem; }
    .app-header { padding: 0.85rem 1rem; }
    .app-title-main { font-size: 0.85rem; letter-spacing: 3px; }
    .section-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
    .section-card { padding: 1.5rem 1rem 1.25rem; }
    .section-icon { font-size: 2.25rem; }
    .suspended-title { font-size: 1.4rem; letter-spacing: 5px; }
    .suspended-icon { font-size: 3.5rem; }
    .admin-grid { grid-template-columns: 1fr; }
    .cursor-glow { display: none; }
    .quick-bar { padding: 0.75rem; gap: 0.5rem; }
    .quick-btn { padding: 0.55rem 0.85rem; font-size: 0.65rem; }
  }

  /* RTL Support */
  [dir="rtl"] .app-title { flex-direction: row-reverse; }
  [dir="rtl"] .user-info { flex-direction: row-reverse; }
  [dir="rtl"] .admin-header { flex-direction: row-reverse; }
  [dir="rtl"] .quick-bar { flex-direction: row-reverse; }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>

<div id="app">
  <div class="app-header">
    <div class="app-title">
      <div class="app-logo">◈</div>
      <div class="app-title-text">
        <div class="app-title-main" data-i18n="login.title">ABYSS</div>
        <div class="app-title-sub" data-i18n="dash.title">Command Center</div>
      </div>
    </div>
    <div class="user-info">
      <div class="user-badge" id="userBadge">—</div>
      <a class="icon-btn" href="dm.html" title="Direct Messages" id="dmBtn">
        💬
        <span class="q-badge" id="dmBadge" style="display:none; position:absolute; top:-6px; right:-6px;">0</span>
      </a>
      <a class="icon-btn" href="settings.html" title="Settings">⚙</a>
      <button class="logout-btn" id="logoutBtn">
        <span>⏻</span>
        <span data-i18n="dash.exit">Exit</span>
      </button>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="quick-bar">
    <a class="quick-btn" href="chat.html">
      <span class="q-ico">💬</span>
      <span data-i18n="chat.title">Chat</span 
    </a>
    <a class="quick-btn" href="dm.html" id="dmQuickBtn">
      <span class="q-ico">✉</span>
      <span data-i18n="dm.title">Direct Messages</span>
      <span class="q-badge" id="dmQuickBadge" style="display:none;">0</span>
    </a>
    <a class="quick-btn" href="files.html">
      <span class="q-ico">📁</span>
      <span data-i18n="files.title">Files</span>
    </a>
    <a class="quick-btn" href="accounts.html">
      <span class="q-ico">👤</span>
      <span data-i18n="accounts.title">Names</span>
    </a>
    <a class="quick-btn" href="settings.html">
      <span class="q-ico">⚙</span>
      <span data-i18n="settings.title">Settings</span>
    </a>
  </div>

  <!-- Admin panel -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <div class="admin-icon">➕</div>
      <div class="admin-title" data-i18n="dash.add_section">Add New Section</div>
    </div>

    <div class="admin-grid">
      <div class="admin-field">
        <label data-i18n="dash.icon">Icon</label>
        <input type="text" class="emoji-input" id="newIcon" value="🔷" maxlength="4">
      </div>
      <div class="admin-field">
        <label data-i18n="dash.name">Name</label>
        <input type="text" id="newName" placeholder="e.g. Games" maxlength="20" autocomplete="off">
      </div>
      <div class="admin-field">
        <label data-i18n="dash.description">Description</label>
        <input type="text" id="newDesc" placeholder="short description" maxlength="40" autocomplete="off">
      </div>
      <div class="admin-field">
        <label data-i18n="dash.url">URL (optional)</label>
        <input type="text" id="newUrl" placeholder="games.html" maxlength="60" autocomplete="off">
      </div>
    </div>

    <div class="admin-actions">
      <button class="btn-add" id="addSectionBtn">
        <span>▸</span>
        <span data-i18n="dash.add">Add Section</span>
      </button>
    </div>
  </div>

  <div class="section-grid" id="sectionGrid"></div>
</div>

<!-- ✅ تحميل اللغة بعد DOM -->
<script src="lang.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  deleteDoc, doc, query, orderBy, getDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

/* ============ CURSOR GLOW ============ */
const cursorGlow = document.getElementById('cursorGlow');
let rafPending = false;
document.addEventListener('mousemove', function(e){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    cursorGlow.style.transform = 'translate(' + (e.clientX - 200) + 'px, ' + (e.clientY - 200) + 'px)';
    cursorGlow.classList.add('active');
    rafPending = false;
  });
}, { passive: true });
document.addEventListener('mouseleave', function(){
  cursorGlow.classList.remove('active');
});

/* ============ MATRIX RAIN ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  const theme = window.AbyssTheme ? window.AbyssTheme.get() : 'abyss';
  const primaryColors = {
    abyss: '#ff1e3c',
    matrix: '#00ff41',
    ice: '#00c8ff',
    void: '#b400ff',
    stealth: '#a0a0a0'
  };
  const color = primaryColors[theme] || '#ff1e3c';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    mctx.fillStyle = Math.random() > 0.985 ? '#ffffff' : color;
    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ AUTH ============ */
let currentUser = null;
let isAdmin = false;
let isSuspendedScreen = false;

onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  let stored = sessionStorage.getItem('abyss_user');
  if (!stored && user.email){
    const emailUser = user.email.split('@')[0];
    stored = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }
  currentUser = stored || 'unknown';
  isAdmin = (currentUser.toLowerCase() === ADMIN_USER.toLowerCase());

  const badge = document.getElementById('userBadge');
  badge.textContent = currentUser + (isAdmin ? ' ★' : '');
  if (isAdmin) badge.classList.add('admin');

  const adminPanel = document.getElementById('adminPanel');
  if (isAdmin) adminPanel.classList.add('active');

  await renderSections();
  watchSettings();
  watchDMNotifications();
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ DM NOTIFICATIONS ============ */
async function watchDMNotifications(){
  if (!currentUser) return;

  try {
    const q = query(collection(db, 'dms'), orderBy('time', 'desc'));
    onSnapshot(q, function(snap){
      let unread = 0;
      snap.forEach(function(d){
        const dm = d.data();
        // DM is between currentUser and someone else
        if (dm.from !== currentUser && dm.to !== currentUser) return;
        if (dm.from === currentUser) return;
        // It's a message TO me — check if unread
        const readBy = dm.readBy || [];
        if (readBy.indexOf(currentUser) === -1){
          unread++;
        }
      });

      const badges = [document.getElementById('dmBadge'), document.getElementById('dmQuickBadge')];
      badges.forEach(function(b){
        if (!b) return;
        if (unread > 0){
          b.textContent = unread > 99 ? '99+' : unread;
          b.style.display = 'flex';
        } else {
          b.style.display = 'none';
        }
      });
    });
  } catch(e){
    console.error('DM notifications error:', e);
  }
}

/* ============ LIVE WATCH: suspension & lock ============ */
function watchSettings(){
  const settingsRef = doc(db, 'settings', 'global');
  onSnapshot(settingsRef, function(snap){
    if (!snap.exists()) return;
    const data = snap.data();

    if (isAdmin) return;

    const suspended = data.suspended || [];
    const locked = data.locked === true;

    if (suspended.indexOf(currentUser) !== -1){
      showSuspendedScreen('suspended');
      return;
    }
    if (locked){
      showSuspendedScreen('locked');
      return;
    }

    if (isSuspendedScreen){
      isSuspendedScreen = false;
      location.reload();
    }
  });
}

function showSuspendedScreen(reason){
  if (isSuspendedScreen) return;
  isSuspendedScreen = true;

  const grid = document.getElementById('sectionGrid');
  const adminPanel = document.getElementById('adminPanel');
  adminPanel.classList.remove('active');

  const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };
  const title = reason === 'locked' ? t('login.locked') : t('login.suspended');
  const icon = reason === 'locked' ? '⛓' : '🚫';

  grid.innerHTML = `
    <div class="suspended-screen">
      <div class="suspended-icon">${icon}</div>
      <h1 class="suspended-title">${title}</h1>
      <div class="suspended-footer">
        <p>${t('dash.by_creator')}</p>
        <button class="exit-btn" id="suspendExit">⏻ ${t('dash.exit')}</button>
      </div>
    </div>
  `;

  document.getElementById('suspendExit').addEventListener('click', async function(){
    sessionStorage.clear();
    await signOut(auth);
    window.location.href = 'index.html';
  });
}

/* ============ SECTIONS ============ */
const DEFAULT_SECTIONS = [
  { name: 'Chat',  name_ar: 'الشات', icon: '💬', desc: 'General chat',  desc_ar: 'الشات العام', url: 'chat.html', default: true, order: 1 },
  { name: 'DM',    name_ar: 'الخاص', icon: '✉',  desc: 'Direct messages', desc_ar: 'رسائل خاصة', url: 'dm.html',   default: true, order: 2 },
  { name: 'Files', name_ar: 'الملفات', icon: '📁', desc: 'Image vault',   desc_ar: 'خزنة الصور', url: 'files.html', default: true, order: 3 },
  { name: 'Names', name_ar: 'الأسماء', icon: '👤', desc: 'Account registry', desc_ar: 'سجل الأسماء', url: 'accounts.html', default: true, order: 4 }
  { name: 'Names', name_ar: 'نظام لينكس', icon: '👤', desc: 'Linux Terminal', desc_ar: 'لوحة لينكس', url: 'terminal.html', default: true, order: 4 }
];
const ADMIN_SECTION = { name: 'Commands', name_ar: 'الأوامر', icon: '🔒', desc: 'Admin center', desc_ar: 'مركز الأوامر', url: 'admin.html', default: true, order: 99 };

async function renderSections(){
  const grid = document.getElementById('sectionGrid');
  grid.innerHTML = '';

  const lang = window.AbyssLang ? window.AbyssLang.getLang() : 'en';

  let custom = [];
  try {
    const snap = await getDocs(query(collection(db, 'sections'), orderBy('order', 'asc')));
    snap.forEach(function(d){
      custom.push(Object.assign({ id: d.id }, d.data()));
    });
  } catch (e){
    console.error('Failed to load custom sections:', e);
  }

  const sections = DEFAULT_SECTIONS.slice();
  custom.forEach(function(c){
    sections.push(Object.assign({ default: false }, c));
  });

  sections.sort(function(a, b){
    return (a.order || 50) - (b.order || 50);
  });

  sections.push(ADMIN_SECTION);

  sections.forEach(function(s){
    const hasUrl = s.url && s.url.trim() !== '';
    const card = document.createElement('a');
    card.className = 'section-card';
    if (!hasUrl) card.classList.add('empty');

    if (hasUrl){
      card.href = s.url;
    } else {
      card.href = 'javascript:void(0)';
      card.style.cursor = 'not-allowed';
    }

    const displayName = (lang === 'ar' && s.name_ar) ? s.name_ar : s.name;
    const displayDesc = (lang === 'ar' && s.desc_ar) ? s.desc_ar : (s.desc || '');

    card.innerHTML =
      '<span class="section-icon">' + (s.icon || '🔷') + '</span>' +
      '<div class="section-name">' + escapeHtml(displayName || 'Untitled') + '</div>' +
      '<div class="section-desc">' + escapeHtml(displayDesc || (hasUrl ? '' : 'Awaiting setup')) + '</div>';

    if (isAdmin && !s.default && s.id){
      const del = document.createElement('button');
      del.className = 'delete-btn admin-visible';
      del.textContent = '✕';
      del.title = 'Delete section';
      del.addEventListener('click', async function(e){
        e.preventDefault();
        e.stopPropagation();
        if (!confirm('Delete section "' + s.name + '"?')) return;
        try {
          await deleteDoc(doc(db, 'sections', s.id));
          await renderSections();
        } catch(err){
          console.error(err);
          alert('Failed to delete: ' + err.message);
        }
      });
      card.appendChild(del);
    }

    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ============ ADD SECTION ============ */
document.getElementById('addSectionBtn').addEventListener('click', async function(){
  if (!isAdmin) return;

  const icon = document.getElementById('newIcon').value.trim() || '🔷';
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const url  = document.getElementById('newUrl').value.trim();

  if (!name){
    alert('⚠ Section name is required');
    return;
  }

  const btn = this;
  btn.disabled = true;

  try {
    const snap = await getDocs(collection(db, 'sections'));
    let maxOrder = 10;
    snap.forEach(function(d){
      const o = d.data().order || 0;
      if (o > maxOrder) maxOrder = o;
    });

    await addDoc(collection(db, 'sections'), {
      icon: icon,
      name: name,
      desc: desc,
      url: url,
      order: maxOrder + 10,
      owner: currentUser,
      createdAt: Date.now()
    });

    document.getElementById('newIcon').value = '🔷';
    document.getElementById('newName').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newUrl').value = '';

    await renderSections();
  } catch (e){
    console.error(e);
    alert('Failed to add section: ' + e.message);
  }

  btn.disabled = false;
});

/* ============ REACT TO LANGUAGE CHANGE ============ */
window.addEventListener('langChanged', function(){
  renderSections();
});
</script>
</body>
</html>
