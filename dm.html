<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · DIRECT MESSAGES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg, #030308);
    color: var(--text, #ebebf5);
    min-height: 100vh;
    transition: background 0.4s, color 0.4s;
    background-image:
      radial-gradient(circle at 15% 20%, var(--primary-glow, rgba(255,30,60,0.12)) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--primary-glow, rgba(255,30,60,0.08)) 0%, transparent 45%);
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.15;
  }

  .app-container {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    gap: 1rem;
    padding: 1rem;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--card, rgba(10,10,18,0.75));
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.3));
  }

  .sidebar-header {
    padding: 1.25rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .sidebar-title {
    font-size: 0.9rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    text-shadow: 0 0 15px var(--primary-glow, rgba(255,30,60,0.6));
  }

  .sidebar-actions {
    display: flex;
    gap: 0.4rem;
  }

  .icon-btn-sm {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    text-decoration: none;
    font-family: inherit;
  }
  .icon-btn-sm:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
  }

  .search-box {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
  }

  .search-box input {
    width: 100%;
    padding: 0.65rem 0.9rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.2));
    border-radius: 10px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus {
    border-color: var(--primary, #ff1e3c);
  }

  .filter-tabs {
    display: flex;
    padding: 0.75rem 1rem 0;
    gap: 0.4rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
  }

  .filter-tab {
    padding: 0.5rem 0.85rem;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: 2px solid transparent;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.2s;
    border-radius: 8px 8px 0 0;
  }
  .filter-tab:hover { color: var(--text, #ebebf5); }
  .filter-tab.active {
    color: var(--primary, #ff1e3c);
    border-bottom-color: var(--primary, #ff1e3c);
  }

  .contacts-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    scrollbar-width: thin;
    scrollbar-color: var(--primary, #ff1e3c) transparent;
  }
  .contacts-list::-webkit-scrollbar { width: 6px; }
  .contacts-list::-webkit-scrollbar-thumb {
    background: var(--border, rgba(255,30,60,0.3));
    border-radius: 3px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    border: 1px solid transparent;
  }

  .contact-item:hover {
    background: rgba(255, 30, 60, 0.06);
    border-color: var(--border, rgba(255,30,60,0.25));
  }

  .contact-item.active {
    background: rgba(255, 30, 60, 0.12);
    border-color: var(--primary, #ff1e3c);
    box-shadow: 0 0 20px var(--primary-glow, rgba(255,30,60,0.3));
  }

  .contact-avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, rgba(255, 30, 60, 0.2), rgba(255, 30, 60, 0.05));
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--primary, #ff1e3c);
    flex-shrink: 0;
    position: relative;
  }

  .contact-info {
    flex: 1;
    min-width: 0;
  }

  .contact-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text, #ebebf5);
    letter-spacing: 0.5px;
    margin-bottom: 0.2rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .contact-name .fav-star {
    color: #ffaa00;
    font-size: 0.75rem;
    filter: drop-shadow(0 0 5px #ffaa00);
  }

  .contact-last {
    font-size: 0.72rem;
    color: var(--text-dim, #70707f);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-fav-btn {
    background: transparent;
    border: none;
    color: var(--text-mute, #3a3a48);
    font-size: 1rem;
    cursor: pointer;
    padding: 0.25rem;
    transition: all 0.2s;
    font-family: inherit;
  }

  .contact-fav-btn:hover { transform: scale(1.2); }
  .contact-fav-btn.active { color: #ffaa00; }

  /* ============ CHAT AREA ============ */
  .chat-area {
    background: var(--card, rgba(10,10,18,0.75));
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.3));
  }

  .chat-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .chat-header-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: 1;
    min-width: 0;
  }

  .chat-header-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text, #ebebf5);
    letter-spacing: 1px;
  }

  .chat-header-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--success, #00ff88);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .chat-header-actions {
    display: flex;
    gap: 0.4rem;
  }

  .call-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
    text-decoration: none;
  }
  .call-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
    transform: translateY(-2px);
  }
  .call-btn.voice:hover { background: var(--success, #00ff88); }
  .call-btn.video:hover { background: #00c8ff; }
  .call-btn.screen:hover { background: #b400ff; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    scrollbar-width: thin;
    scrollbar-color: var(--primary, #ff1e3c) transparent;
  }
  .chat-messages::-webkit-scrollbar { width: 8px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--border, rgba(255,30,60,0.3));
    border-radius: 4px;
  }

  .dm-msg {
    max-width: 70%;
    padding: 0.65rem 1rem;
    border-radius: 14px;
    font-size: 0.88rem;
    word-wrap: break-word;
    line-height: 1.5;
    position: relative;
    animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dm-msg.sent {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--primary, #ff1e3c), var(--primary-2, #cc0022));
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px var(--primary-glow, rgba(255,30,60,0.4));
  }

  .dm-msg.received {
    align-self: flex-start;
    background: rgba(5, 5, 12, 0.7);
    border: 1px solid var(--border, rgba(255,30,60,0.2));
    color: var(--text, #ebebf5);
    border-bottom-left-radius: 4px;
  }

  .dm-msg .msg-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    opacity: 0.7;
    margin-top: 0.35rem;
    display: block;
    letter-spacing: 1px;
  }

  .dm-msg img {
    max-width: 250px;
    max-height: 250px;
    border-radius: 10px;
    margin-top: 0.4rem;
    display: block;
    cursor: pointer;
  }

  .empty-chat {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    color: var(--text-mute, #3a3a48);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    padding: 2rem;
  }

  .empty-chat .icon {
    font-size: 4rem;
    opacity: 0.3;
  }

  .chat-input-row {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border, rgba(255,30,60,0.15));
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
  }

  .chat-input-row input[type="text"] {
    flex: 1;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input-row input[type="text"]:focus {
    border-color: var(--primary, #ff1e3c);
  }

  .chat-input-row button[type="submit"] {
    padding: 0.85rem 1.5rem;
    background: linear-gradient(135deg, var(--primary, #ff1e3c) 0%, var(--primary-2, #cc0022) 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 4px 20px var(--primary-glow, rgba(255,30,60,0.4));
    white-space: nowrap;
  }
  .chat-input-row button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 25px var(--primary-glow, rgba(255,30,60,0.55));
  }

  /* ============ CALL MODAL ============ */
  .call-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0, 0, 0, 0.95);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .call-modal.active { display: flex; }

  .call-container {
    width: 100%;
    max-width: 900px;
    background: var(--card-solid, rgba(12,12,22,0.95));
    border: 1px solid var(--border, rgba(255,30,60,0.3));
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9);
  }

  .call-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.2));
  }

  .call-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary, #ff1e3c);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .call-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim, #70707f);
    letter-spacing: 1.5px;
  }

  .video-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .video-tile {
    background: #000;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 12px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
  }

  .video-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-tile .tile-label {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid var(--border, rgba(255,30,60,0.3));
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text, #ebebf5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .placeholder-full {
    grid-column: 1 / -1;
    padding: 3rem;
    text-align: center;
    color: var(--text-mute, #3a3a48);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .call-controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 0.65rem 1.25rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--text, #ebebf5);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .ctrl-btn:hover {
    border-color: var(--primary, #ff1e3c);
    background: rgba(255, 30, 60, 0.1);
  }
  .ctrl-btn.active {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
  }
  .ctrl-btn.danger {
    border-color: #ff1e3c;
    color: #ff1e3c;
  }
  .ctrl-btn.danger:hover {
    background: #ff1e3c;
    color: #000;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 768px) {
    body { overflow: auto; }
    .app-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: auto;
      min-height: 100vh;
    }
    .sidebar { max-height: 300px; }
    .chat-area { min-height: 60vh; }
    .dm-msg { max-width: 85%; }
    .video-grid { grid-template-columns: 1fr; }
  }

  [dir="rtl"] .dm-msg.sent {
    border-bottom-right-radius: 14px;
    border-bottom-left-radius: 4px;
  }
  [dir="rtl"] .dm-msg.received {
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 4px;
  }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="app-container">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title" data-i18n="dm.title">Direct Messages</div>
      <div class="sidebar-actions">
        <a class="icon-btn-sm" href="dashboard.html" title="Back">←</a>
        <a class="icon-btn-sm" href="settings.html" title="Settings">⚙</a>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search contacts..." data-i18n-placeholder="dm.search">
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" data-i18n="dm.all">All</button>
      <button class="filter-tab" data-filter="favorites" data-i18n="dm.favorites">Favorites</button>
    </div>

    <div class="contacts-list" id="contactsList"></div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="empty-chat">
      <div class="icon">💬</div>
      <div data-i18n="dm.select_chat">Select a contact to start chatting</div>
    </div>
  </div>
</div>

<!-- CALL MODAL -->
<div class="call-modal" id="callModal">
  <div class="call-container">
    <div class="call-header">
      <div class="call-title" id="callTitle">📞 Call</div>
      <div class="call-status" id="callStatus">Connecting...</div>
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="video-tile" id="localVideoTile" style="display:none;">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="tile-label">YOU</div>
      </div>
      <div class="video-tile" id="remoteVideoTile" style="display:none;">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="tile-label" id="remoteLabel">REMOTE</div>
      </div>
      <div class="placeholder-full" id="remotePlaceholder">
        Waiting for connection...
      </div>
    </div>

    <div class="call-controls">
      <button class="ctrl-btn" id="btnMic">🎤 Mic</button>
      <button class="ctrl-btn" id="btnCam">📷 Cam</button>
      <button class="ctrl-btn" id="btnScreen">🖥 Screen</button>
      <button class="ctrl-btn danger" id="btnHangup">⏹ End</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="lang.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, query, where, orderBy,
  doc, getDoc, setDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

let currentUser = null;
let currentContact = null;
let allContacts = [];
let favorites = [];
let currentFilter = 'all';
let searchTerm = '';
let unsubMessages = null;

/* ============ MATRIX RAIN ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  const theme = window.AbyssTheme ? window.AbyssTheme.get() : 'abyss';
  const primaryColors = {
    abyss: '#ff1e3c',
    matrix: '#00ff41',
    ice: '#00c8ff',
    void: '#b400ff',
    stealth: '#a0a0a0'
  };
  const color = primaryColors[theme] || '#ff1e3c';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;
    mctx.fillStyle = color;
    mctx.fillText(text, x, y);
    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ HELPERS ============ */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function chatIdFor(a, b){
  const sorted = [a, b].sort();
  return sorted[0] + '__' + sorted[1];
}

function formatTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return sameDay ? time : d.toLocaleDateString() + ' · ' + time;
}

/* ============ AUTH ============ */
onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  const stored = sessionStorage.getItem('abyss_user');
  if (stored){
    currentUser = stored;
  } else {
    const emailUser = user.email.split('@')[0];
    currentUser = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }

  try {
    const favSnap = await getDoc(doc(db, 'favorites', currentUser));
    if (favSnap.exists()){
      favorites = favSnap.data().list || [];
    }
  } catch(e){}

  await loadContacts();
});

/* ============ LOAD CONTACTS ============ */
async function loadContacts(){
  try {
    const snap = await getDocs(collection(db, 'accounts'));
    allContacts = [];
    snap.forEach(function(d){
      const data = d.data();
      const username = data.username || d.id;
      if (username.toLowerCase() !== currentUser.toLowerCase()){
        allContacts.push({
          username: username,
          realName: data.realName || ''
        });
      }
    });

    allContacts.sort(function(a, b){
      return a.username.localeCompare(b.username);
    });

    renderContacts();
  } catch(e){
    console.error('Load contacts error:', e);
  }
}

/* ============ RENDER CONTACTS ============ */
function renderContacts(){
  const list = document.getElementById('contactsList');
  list.innerHTML = '';

  let filtered = allContacts;

  if (currentFilter === 'favorites'){
    filtered = filtered.filter(function(c){
      return favorites.indexOf(c.username) !== -1;
    });
  }

  if (searchTerm){
    const s = searchTerm.toLowerCase();
    filtered = filtered.filter(function(c){
      return c.username.toLowerCase().includes(s) ||
             (c.realName || '').toLowerCase().includes(s);
    });
  }

  if (!filtered.length){
    list.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:2rem 1rem;font-family:JetBrains Mono,monospace;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;">no contacts</div>';
    return;
  }

  filtered.forEach(function(c){
    const isFav = favorites.indexOf(c.username) !== -1;
    const isActive = currentContact && currentContact.username === c.username;

    const item = document.createElement('div');
    item.className = 'contact-item' + (isActive ? ' active' : '');

    const avatar = document.createElement('div');
    avatar.className = 'contact-avatar';
    avatar.textContent = c.username.charAt(0).toUpperCase();

    const info = document.createElement('div');
    info.className = 'contact-info';

    const name = document.createElement('div');
    name.className = 'contact-name';
    name.innerHTML = escapeHtml(c.username) +
      (isFav ? '<span class="fav-star">★</span>' : '');

    const last = document.createElement('div');
    last.className = 'contact-last';
    last.textContent = c.realName || '—';

    info.appendChild(name);
    info.appendChild(last);

    const favBtn = document.createElement('button');
    favBtn.className = 'contact-fav-btn' + (isFav ? ' active' : '');
    favBtn.textContent = isFav ? '★' : '☆';
    favBtn.title = isFav ? 'Remove favorite' : 'Add favorite';
    favBtn.addEventListener('click', function(e){
      e.stopPropagation();
      toggleFavorite(c.username);
    });

    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(favBtn);

    item.addEventListener('click', function(){
      openChat(c);
    });

    list.appendChild(item);
  });
}

/* ============ TOGGLE FAVORITE ============ */
async function toggleFavorite(username){
  const idx = favorites.indexOf(username);
  if (idx !== -1){
    favorites.splice(idx, 1);
  } else {
    favorites.push(username);
  }

  try {
    await setDoc(doc(db, 'favorites', currentUser), { list: favorites });
  } catch(e){
    console.error(e);
  }

  renderContacts();
}

/* ============ OPEN CHAT ============ */
async function openChat(contact){
  currentContact = contact;
  renderContacts();

  const chatArea = document.getElementById('chatArea');
  const chatId = chatIdFor(currentUser, contact.username);

  const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };

  chatArea.innerHTML = `
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="contact-avatar" style="width:38px;height:38px;font-size:0.9rem;">
          ${escapeHtml(contact.username.charAt(0).toUpperCase())}
        </div>
        <div>
          <div class="chat-header-name">${escapeHtml(contact.username)}</div>
          <div class="chat-header-status">● ${escapeHtml(contact.realName || 'Online')}</div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="call-btn voice" id="callVoice" title="Voice Call">🎤</button>
        <button class="call-btn video" id="callVideo" title="Video Call">📷</button>
        <button class="call-btn screen" id="callScreen" title="Screen Share">🖥</button>
      </div>
    </div>
    <div class="chat-messages" id="dmMessages"></div>
    <form class="chat-input-row" id="dmForm">
      <input type="text" id="dmInput" placeholder="${t('dm.type_message')}" autocomplete="off" maxlength="500">
      <button type="submit">▸ ${t('dm.send')}</button>
    </form>
  `;

  if (unsubMessages) unsubMessages();

  const q = query(
    collection(db, 'dms'),
    where('chatId', '==', chatId),
    orderBy('time', 'asc')
  );

  unsubMessages = onSnapshot(q, function(snap){
    const messages = [];
    snap.forEach(function(d){
      messages.push(Object.assign({ id: d.id }, d.data()));
    });
    renderMessages(messages);
    markAsRead(snap);
  });

  document.getElementById('dmForm').addEventListener('submit', async function(e){
    e.preventDefault();
    await sendDM();
  });

  document.getElementById('callVoice').addEventListener('click', function(){
    startCall('voice');
  });
  document.getElementById('callVideo').addEventListener('click', function(){
    startCall('video');
  });
  document.getElementById('callScreen').addEventListener('click', function(){
    startCall('voice');
    // افتح الشير بعد 1.5 ثانية
    setTimeout(function(){
      const btnScreen = document.getElementById('btnScreen');
      if (btnScreen) btnScreen.click();
    }, 1500);
  });
}

/* ============ RENDER MESSAGES ============ */
function renderMessages(messages){
  const container = document.getElementById('dmMessages');
  if (!container) return;

  const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
  container.innerHTML = '';

  const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };

  if (!messages.length){
    container.innerHTML = `<div style="text-align:center;color:var(--text-mute);padding:2rem;font-family:JetBrains Mono,monospace;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;">${t('dm.no_messages')}</div>`;
    return;
  }

  messages.forEach(function(m){
    const div = document.createElement('div');
    const isSent = m.from === currentUser;
    div.className = 'dm-msg ' + (isSent ? 'sent' : 'received');

    let content = '';
    if (m.text) content += '<div>' + escapeHtml(m.text) + '</div>';
    if (m.image) content += '<img src="' + m.image + '" data-img="1">';
    content += '<span class="msg-time">' + formatTime(m.time) + '</span>';

    div.innerHTML = content;
    container.appendChild(div);
  });

  container.querySelectorAll('img[data-img]').forEach(function(img){
    img.addEventListener('click', function(){
      window.open(img.src, '_blank');
    });
  });

  if (wasAtBottom) container.scrollTop = container.scrollHeight;
}

/* ============ SEND DM ============ */
async function sendDM(){
  if (!currentContact) return;
  const input = document.getElementById('dmInput');
  const text = input.value.trim();
  if (!text) return;

  const chatId = chatIdFor(currentUser, currentContact.username);

  try {
    await addDoc(collection(db, 'dms'), {
      chatId: chatId,
      from: currentUser,
      to: currentContact.username,
      text: text,
      image: null,
      readBy: [currentUser],
      time: Date.now()
    });

    input.value = '';
  } catch(e){
    console.error('Send DM error:', e);
    alert('Failed to send: ' + e.message);
  }
}

/* ============ MARK AS READ ============ */
async function markAsRead(snap){
  const updates = [];
  snap.forEach(function(d){
    const data = d.data();
    if (data.to === currentUser){
      const readBy = data.readBy || [];
      if (readBy.indexOf(currentUser) === -1){
        updates.push(updateDoc(doc(db, 'dms', d.id), {
          readBy: readBy.concat([currentUser])
        }));
      }
    }
  });
  try {
    await Promise.all(updates);
  } catch(e){}
}

/* ============ SEARCH & FILTER ============ */
document.getElementById('searchInput').addEventListener('input', function(e){
  searchTerm = e.target.value.trim();
  renderContacts();
});

document.querySelectorAll('.filter-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.filter-tab').forEach(function(t){
      t.classList.remove('active');
    });
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderContacts();
  });
});

/* ============================================================
   ============ WEBRTC CALLS (PeerJS) ============
   ============================================================ */

let peer = null;
let currentCall = null;
let localStream = null;
let screenStream = null;
let micEnabled = true;
let camEnabled = false;  // ✅ مقفلة افتراضياً
let callType = null;

function getPeerId(username){
  return 'abyss-' + username.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function initPeer(){
  if (peer) return;
  const myId = getPeerId(currentUser);
  peer = new Peer(myId, {
    debug: 0,
    config: {
      'iceServers': [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('call', function(call){
    const confirmCall = confirm('📞 ' + call.peer + ' is calling you. Accept?');
    if (confirmCall){
      answerCall(call);
    } else {
      call.close();
    }
  });

  peer.on('error', function(err){
    console.error('Peer error:', err);
  });
}

/* ✅ جيب المايك فقط */
async function getAudioOnly(){
  return await navigator.mediaDevices.getUserMedia({
    video: false,
    audio: true
  });
}

/* ✅ جيب المايك + الكاميرا */
async function getAudioVideo(){
  return await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 },
    audio: true
  });
}

/* ✅ جيب الشاشة */
async function getScreen(){
  return await navigator.mediaDevices.getDisplayMedia({
    video: { cursor: 'always' },
    audio: false
  });
}

async function startCall(type){
  if (!currentContact) return;
  initPeer();

  callType = type;

  const modal = document.getElementById('callModal');
  const title = document.getElementById('callTitle');
  const status = document.getElementById('callStatus');

  modal.classList.add('active');
  title.textContent = type === 'voice' ? '🎤 Voice Call' : '📷 Video Call';
  status.textContent = 'Calling ' + currentContact.username + '...';

  camEnabled = (type === 'video');
  micEnabled = true;

  try {
    if (type === 'video'){
      localStream = await getAudioVideo();
    } else {
      localStream = await getAudioOnly();
    }

    const localVideo = document.getElementById('localVideo');
    localVideo.srcObject = localStream;

    if (!camEnabled){
      localVideo.style.display = 'none';
      document.getElementById('localVideoTile').style.display = 'none';
    } else {
      localVideo.style.display = 'block';
      document.getElementById('localVideoTile').style.display = 'block';
    }

    updateCallButtons();

    const remoteId = getPeerId(currentContact.username);
    currentCall = peer.call(remoteId, localStream);

    if (currentCall){
      currentCall.on('stream', function(remoteStream){
        const remoteVideo = document.getElementById('remoteVideo');
        remoteVideo.srcObject = remoteStream;
        document.getElementById('remotePlaceholder').style.display = 'none';
        document.getElementById('remoteVideoTile').style.display = 'block';
        status.textContent = '● Connected';
      });

      currentCall.on('close', endCall);
      currentCall.on('error', function(err){
        console.error('Call error:', err);
        status.textContent = '✕ ' + err.message;
      });
    }
  } catch(e){
    console.error(e);
    status.textContent = '✕ ' + e.message;
    setTimeout(endCall, 2000);
  }

  bindCallControls();
}

async function answerCall(call){
  const modal = document.getElementById('callModal');
  modal.classList.add('active');
  document.getElementById('callTitle').textContent = '📞 Incoming Call';
  document.getElementById('callStatus').textContent = 'Connecting...';

  callType = 'voice';
  camEnabled = false;
  micEnabled = true;

  try {
    localStream = await getAudioOnly();

    const localVideo = document.getElementById('localVideo');
    localVideo.srcObject = localStream;
    localVideo.style.display = 'none';
    document.getElementById('localVideoTile').style.display = 'none';

    updateCallButtons();

    call.answer(localStream);

    call.on('stream', function(remoteStream){
      const remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.srcObject = remoteStream;
      document.getElementById('remotePlaceholder').style.display = 'none';
      document.getElementById('remoteVideoTile').style.display = 'block';
      document.getElementById('callStatus').textContent = '● Connected';
    });

    call.on('close', endCall);
    currentCall = call;
    bindCallControls();
  } catch(err){
    console.error(err);
    call.close();
    endCall();
  }
}

function updateCallButtons(){
  const btnMic = document.getElementById('btnMic');
  const btnCam = document.getElementById('btnCam');
  const btnScreen = document.getElementById('btnScreen');

  btnMic.classList.toggle('active', !micEnabled);
  btnCam.classList.toggle('active', camEnabled);
  btnScreen.classList.remove('active');
}

function bindCallControls(){
  const btnMic = document.getElementById('btnMic');
  const btnCam = document.getElementById('btnCam');
  const btnScreen = document.getElementById('btnScreen');
  const btnHangup = document.getElementById('btnHangup');

  // ✅ زر المايك
  btnMic.onclick = function(){
    if (!localStream) return;
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(function(t){ t.enabled = micEnabled; });
    updateCallButtons();
  };

  // ✅ زر الكاميرا — يفتحها ويسكرها
  btnCam.onclick = async function(){
    if (!localStream) return;

    if (camEnabled){
      // سكّر الكاميرا
      const videoTracks = localStream.getVideoTracks();
      videoTracks.forEach(function(t){ t.stop(); });
      videoTracks.forEach(function(t){ localStream.removeTrack(t); });

      document.getElementById('localVideo').srcObject = null;
      camEnabled = false;

      if (currentCall && currentCall.peerConnection){
        const sender = currentCall.peerConnection.getSenders().find(function(s){
          return s.track && s.track.kind === 'video';
        });
        if (sender) await sender.replaceTrack(null);
      }
    } else {
      // افتح الكاميرا
      try {
        const videoStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        const videoTrack = videoStream.getVideoTracks()[0];
        localStream.addTrack(videoTrack);

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('localVideo').style.display = 'block';
        document.getElementById('localVideoTile').style.display = 'block';

        if (currentCall && currentCall.peerConnection){
          const sender = currentCall.peerConnection.getSenders().find(function(s){
            return !s.track || s.track.kind === 'video';
          });
          if (sender){
            await sender.replaceTrack(videoTrack);
          } else {
            currentCall.peerConnection.addTrack(videoTrack, localStream);
          }
        }

        camEnabled = true;
      } catch(e){
        console.error('Camera error:', e);
        alert('⚠ Cannot open camera: ' + e.message);
      }
    }
    updateCallButtons();
  };

  // ✅ زر الشاشة
  btnScreen.onclick = async function(){
    // إذا الشاشة شغالة، سكرها
    if (screenStream){
      screenStream.getTracks().forEach(function(t){ t.stop(); });
      screenStream = null;

      if (currentCall && currentCall.peerConnection){
        const sender = currentCall.peerConnection.getSenders().find(function(s){
          return s.track && s.track.kind === 'video';
        });

        if (camEnabled && localStream){
          const camTrack = localStream.getVideoTracks()[0];
          if (sender && camTrack) await sender.replaceTrack(camTrack);
        } else {
          if (sender) await sender.replaceTrack(null);
        }
      }

      document.getElementById('localVideo').srcObject = localStream;
      if (!camEnabled) document.getElementById('localVideo').style.display = 'none';
      btnScreen.classList.remove('active');
      return;
    }

    // افتح الشاشة
    try {
      screenStream = await getScreen();
      const screenTrack = screenStream.getVideoTracks()[0];

      document.getElementById('localVideo').srcObject = screenStream;
      document.getElementById('localVideo').style.display = 'block';
      document.getElementById('localVideoTile').style.display = 'block';

      if (currentCall && currentCall.peerConnection){
        const sender = currentCall.peerConnection.getSenders().find(function(s){
          return s.track && s.track.kind === 'video';
        });
        if (sender){
          await sender.replaceTrack(screenTrack);
        } else {
          currentCall.peerConnection.addTrack(screenTrack, screenStream);
        }
      }

      screenTrack.onended = function(){
        btnScreen.click();
      };

      btnScreen.classList.add('active');
    } catch(e){
      console.error('Screen error:', e);
      alert('⚠ Cannot share screen: ' + e.message);
    }
  };

  btnHangup.onclick = endCall;
}

function endCall(){
  if (currentCall){ try { currentCall.close(); } catch(e){} currentCall = null; }
  if (localStream){ localStream.getTracks().forEach(function(t){ t.stop(); }); localStream = null; }
  if (screenStream){ screenStream.getTracks().forEach(function(t){ t.stop(); }); screenStream = null; }

  camEnabled = false;
  micEnabled = true;
  callType = null;

  document.getElementById('callModal').classList.remove('active');
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('remotePlaceholder').style.display = 'block';
  document.getElementById('localVideoTile').style.display = 'none';
  document.getElementById('remoteVideoTile').style.display = 'none';
}

/* ============ REACT TO LANGUAGE ============ */
window.addEventListener('langChanged', function(){
  renderContacts();
  if (currentContact) openChat(currentContact);
});
</script>
