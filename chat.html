<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  body {
    background: var(--bg, #030308);
    color: var(--text, #ebebf5);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    transition: background 0.4s, color 0.4s;
    background-image:
      radial-gradient(circle at 15% 20%, var(--primary-glow, rgba(255,30,60,0.12)) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--primary-glow, rgba(255,30,60,0.08)) 0%, transparent 45%);
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px),
      linear-gradient(90deg, var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.6;
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  #app {
    position: relative;
    z-index: 10;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ============ TOP BAR ============ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.3));
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
    text-shadow: 0 0 15px var(--primary-glow, rgba(255,30,60,0.6));
  }

  .back-btn, .icon-btn, .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .icon-btn { width: 40px; justify-content: center; padding: 0.5rem; }
  .back-btn:hover, .icon-btn:hover, .logout-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: rgba(255, 30, 60, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
  }

  .user-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary, #ff1e3c);
    box-shadow: 0 0 8px var(--primary, #ff1e3c);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.2));
  }

  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    font-weight: 700;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
    flex-wrap: wrap;
  }

  .points-info {
    font-size: 0.7rem;
    color: var(--text-dim, #70707f);
    letter-spacing: 1px;
    font-weight: 400;
    text-transform: none;
  }

  .points-info.warn { color: #ffaa00; }
  .points-info.full { color: var(--primary, #ff1e3c); font-weight: 700; animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ============ CHAT BOX ============ */
  .chat-box {
    height: 60vh;
    min-height: 300px;
    overflow-y: auto;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border, rgba(255,30,60,0.15));
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    scrollbar-width: thin;
    scrollbar-color: var(--primary, #ff1e3c) transparent;
  }

  .chat-box::-webkit-scrollbar { width: 8px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb {
    background: var(--border, rgba(255,30,60,0.3));
    border-radius: 4px;
  }

  .chat-msg {
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
    background: rgba(255, 30, 60, 0.04);
    border-left: 2px solid var(--primary, #ff1e3c);
    border-radius: 8px;
    font-size: 0.88rem;
    word-break: break-word;
    position: relative;
    transition: background 0.2s;
  }

  .chat-msg:hover {
    background: rgba(255, 30, 60, 0.08);
  }

  .chat-msg .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.35rem;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .chat-msg .author {
    color: var(--primary, #ff1e3c);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 8px var(--primary-glow, rgba(255,30,60,0.4));
    font-size: 0.85rem;
  }

  .chat-msg .author .realname {
    color: var(--text-dim, #70707f);
    font-weight: 400;
    font-size: 0.75rem;
    margin-left: 0.4rem;
  }

  .chat-msg .time {
    color: var(--text-mute, #3a3a48);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
  }

  .chat-msg .content {
    color: var(--text, #ebebf5);
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .chat-msg img {
    max-width: 220px;
    max-height: 220px;
    border: 1px solid var(--primary, #ff1e3c);
    border-radius: 8px;
    margin-top: 0.5rem;
    display: block;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .chat-msg img:hover {
    transform: scale(1.02);
  }

  /* ============ REACTIONS BAR ============ */
  .msg-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.6rem;
    flex-wrap: wrap;
  }

  .reactions-row {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }

  .reaction-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.6rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    color: var(--text, #ebebf5);
  }

  .reaction-chip:hover {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    transform: scale(1.05);
  }

  .reaction-chip.mine {
    background: rgba(255, 30, 60, 0.15);
    border-color: var(--primary, #ff1e3c);
  }

  .reaction-chip .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-dim, #70707f);
  }

  .reaction-chip.mine .count {
    color: var(--primary, #ff1e3c);
  }

  .reactions-picker {
    display: none;
    gap: 0.25rem;
    padding: 0.35rem;
    background: var(--card-solid, rgba(12,12,22,0.92));
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 24px;
    position: absolute;
    top: -42px;
    left: 0;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .reactions-picker.show { display: flex; }

  .reactions-picker button {
    background: transparent;
    border: none;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 0.15rem 0.35rem;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
  }

  .reactions-picker button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.2);
  }

  .add-reaction-btn {
    background: transparent;
    border: 1px dashed var(--border, rgba(255,30,60,0.25));
    color: var(--text-dim, #70707f);
    border-radius: 20px;
    padding: 0.25rem 0.6rem;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .add-reaction-btn:hover {
    border-color: var(--primary, #ff1e3c);
    color: var(--primary, #ff1e3c);
    border-style: solid;
  }

  .empty-msg {
    text-align: center;
    color: var(--text-mute, #3a3a48);
    padding: 3rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ============ INPUT ROW ============ */
  .chat-input-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
    flex-wrap: wrap;
  }

  .file-btn {
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .file-btn:hover {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    color: var(--primary, #ff1e3c);
    background: rgba(255, 30, 60, 0.06);
  }

  .chat-input-row input[type="text"] {
    flex: 1;
    min-width: 150px;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chat-input-row input[type="text"]:focus {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    box-shadow: 0 0 0 3px var(--primary-glow, rgba(255,30,60,0.1));
  }

  .chat-input-row input[type="text"]::placeholder {
    color: var(--text-mute, #3a3a48);
    font-weight: 300;
  }

  .chat-input-row button[type="submit"] {
    padding: 0.85rem 1.5rem;
    background: linear-gradient(135deg, var(--primary, #ff1e3c) 0%, var(--primary-2, #cc0022) 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 4px 20px var(--primary-glow, rgba(255,30,60,0.4));
    white-space: nowrap;
  }

  .chat-input-row button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 25px var(--primary-glow, rgba(255,30,60,0.55));
  }

  .chat-input-row button[type="submit"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .char-counter {
    padding: 0.85rem 0.85rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    color: var(--text-dim, #70707f);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    align-self: center;
    min-width: 80px;
    text-align: center;
    transition: all 0.2s;
  }

  .char-counter.warn { color: #ffaa00; border-color: rgba(255, 170, 0, 0.4); }
  .char-counter.over { color: var(--primary, #ff1e3c); border-color: var(--primary, #ff1e3c); font-weight: 700; }

  /* ============ IMAGE PREVIEW ============ */
  .preview-row {
    display: none;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    margin-bottom: 0.75rem;
    background: rgba(255, 30, 60, 0.06);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
  }

  .preview-row.active { display: flex; }

  .preview-row img {
    max-height: 60px;
    max-width: 60px;
    border: 1px solid var(--primary, #ff1e3c);
    border-radius: 8px;
  }

  .preview-row .info {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim, #70707f);
    letter-spacing: 1px;
  }

  .preview-row .remove {
    padding: 0.4rem 0.75rem;
    background: transparent;
    border: 1px solid var(--primary, #ff1e3c);
    color: var(--primary, #ff1e3c);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .preview-row .remove:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
  }

  /* ============ EMOJI PICKER ============ */
  .emoji-btn {
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 10px;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
  }

  .emoji-btn:hover {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    color: var(--primary, #ff1e3c);
    background: rgba(255, 30, 60, 0.06);
  }

  .emoji-picker {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 0;
    margin-bottom: 0.5rem;
    padding: 0.75rem;
    background: var(--card-solid, rgba(12,12,22,0.95));
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    z-index: 100;
    width: 260px;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.15rem;
    max-height: 200px;
    overflow-y: auto;
  }

  .emoji-picker.show { display: grid; }

  .emoji-picker button {
    background: transparent;
    border: none;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 6px;
    transition: all 0.1s;
    font-family: inherit;
  }

  .emoji-picker button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.3);
  }

  /* ============ LIGHTBOX ============ */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0, 0, 0, 0.95);
    align-items: center;
    justify-content: center;
    padding: 2rem;
    flex-direction: column;
    gap: 1.5rem;
  }
  #lightbox.active { display: flex; }

  #lightbox img {
    max-width: 90vw;
    max-height: 80vh;
    border: 2px solid var(--primary, #ff1e3c);
    border-radius: 12px;
    box-shadow: 0 0 60px var(--primary-glow, rgba(255,30,60,0.6));
  }

  #lightbox .close-btn {
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid var(--primary, #ff1e3c);
    color: var(--primary, #ff1e3c);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #lightbox .close-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .top-bar { padding: 0.85rem 1rem; }
    .top-bar h2 { font-size: 0.8rem; letter-spacing: 3px; }
    .chat-box { height: 50vh; }
    .chat-input-row input[type="text"] { min-width: 100px; }
    .char-counter { display: none; }
    .chat-input-row button[type="submit"] { padding: 0.85rem 1rem; }
    .emoji-picker { width: 220px; grid-template-columns: repeat(6, 1fr); }
  }

  [dir="rtl"] .chat-msg { border-left: none; border-right: 2px solid var(--primary, #ff1e3c); }
  [dir="rtl"] .top-bar-left { flex-direction: row-reverse; }
  [dir="rtl"] .top-bar-right { flex-direction: row-reverse; }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>

<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <a class="back-btn" href="dashboard.html">← <span data-i18n="common.back">Back</span></a>
      <h2 data-i18n="chat.title">General Chat</h2>
    </div>
    <div class="top-bar-right">
      <span class="user-badge" id="userBadge">—</span>
      <a class="icon-btn" href="settings.html" title="Settings">⚙</a>
      <button class="logout-btn" id="logoutBtn">⏻ <span data-i18n="dash.exit">Exit</span></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span data-i18n="chat.channel">◈ Encrypted Channel</span>
      <span class="points-info" id="pointsInfo">0 / 500 points</span>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="empty-msg" data-i18n="chat.loading">◈ Loading messages... ◈</div>
    </div>

    <div class="preview-row" id="previewRow">
      <img id="previewImg" src="" alt="">
      <div class="info" id="previewInfo"></div>
      <button class="remove" id="previewRemove" data-i18n="chat.remove">✕ Remove</button>
    </div>

    <div class="chat-input-row" style="position: relative;">
      <label class="file-btn" for="chatFileInput" title="Attach image (10 pts)">📎</label>
      <input type="file" id="chatFileInput" style="display:none" accept="image/*">

      <button class="emoji-btn" id="emojiBtn" type="button" title="Emojis">😊</button>
      <div class="emoji-picker" id="emojiPicker"></div>

      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" maxlength="350" data-i18n-placeholder="chat.type_message">
      <span class="char-counter" id="charCounter">0 / 350</span>
      <button type="submit" id="chatSend" data-i18n="chat.send">▸ Send</button>
    </div>
  </div>
</div>

<div id="lightbox">
  <img id="lightboxImg" src="" alt="">
  <button class="close-btn" onclick="document.getElementById('lightbox').classList.remove('active')">✕ Close</button>
</div>

<script src="lang.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  deleteDoc, doc, query, orderBy, getDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============ MATRIX RAIN ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  const theme = window.AbyssTheme ? window.AbyssTheme.get() : 'abyss';
  const primaryColors = {
    abyss: '#ff1e3c',
    matrix: '#00ff41',
    ice: '#00c8ff',
    void: '#b400ff',
    stealth: '#a0a0a0'
  };
  const color = primaryColors[theme] || '#ff1e3c';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    mctx.fillStyle = Math.random() > 0.985 ? '#ffffff' : color;
    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ AUTH ============ */
onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  const stored = sessionStorage.getItem('abyss_user');
  if (stored){
    currentUser = stored;
  } else {
    const emailUser = user.email.split('@')[0];
    currentUser = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
    sessionStorage.setItem('abyss_user', currentUser);
  }

  document.getElementById('userBadge').textContent = currentUser;

  try {
    const accSnap = await getDoc(doc(db, 'accounts', currentUser));
    if (accSnap.exists() && accSnap.data().realName){
      currentRealName = accSnap.data().realName;
    }
  } catch(e){}

  // Status check
  try {
    const statusSnap = await getDoc(doc(db, 'settings', 'global'));
    if (statusSnap.exists()){
      const data = statusSnap.data();
      const isOwner = currentUser.toLowerCase() === 'devil-0';
      if (!isOwner){
        if (data.locked){
          alert('⛓ The Abyss is locked by the creator.');
          await signOut(auth);
          window.location.replace('index.html');
          return;
        }
        if ((data.suspended || []).indexOf(currentUser) !== -1){
          alert('🚫 Your account is suspended.');
          await signOut(auth);
          window.location.replace('index.html');
          return;
        }
      }
    }
  } catch(e){}

  loadMessages();
});

/* ============ HELPERS ============ */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

const EMOJI_REGEX = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F2FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{1F1E0}-\u{1F1FF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;

function countEmojis(str){
  const m = String(str||'').match(EMOJI_REGEX);
  return m ? m.length : 0;
}

function pointsForText(text){
  const t = String(text||'');
  const emojiCount = countEmojis(t);
  return (t.length - emojiCount) * 1 + emojiCount * EMOJI_POINTS;
}

function pointsForMessage(msg){
  let pts = 0;
  if (msg.text) pts += pointsForText(msg.text);
  if (msg.image) pts += IMG_POINTS;
  return pts;
}

function totalPoints(msgs){
  return msgs.reduce(function(s, m){ return s + pointsForMessage(m); }, 0);
}

function formatTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return sameDay ? time : d.toLocaleDateString() + ' · ' + time;
}

/* ============ LOAD MESSAGES (Real-time) ============ */
function loadMessages(){
  const q = query(collection(db, 'messages'), orderBy('time', 'asc'));
  onSnapshot(q, function(snap){
    allMessages = [];
    snap.forEach(function(d){
      allMessages.push(Object.assign({ id: d.id }, d.data()));
    });
    renderChat();
  }, function(err){
    console.error('Firestore error:', err);
  });
}

/* ============ RENDER CHAT ============ */
function renderChat(){
  const chatBox = document.getElementById('chatBox');
  const wasAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 100;

  chatBox.innerHTML = '';

  if (!allMessages.length){
    chatBox.innerHTML = '<div class="empty-msg">' + (window.AbyssLang ? window.AbyssLang.t('chat.no_messages') : 'No messages yet') + '</div>';
    updatePoints();
    return;
  }

  allMessages.forEach(function(m){
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.dataset.msgId = m.id;

    const realNameHtml = m.realName
      ? '<span class="realname">· ' + escapeHtml(m.realName) + '</span>'
      : '';

    let inner = '<div class="header">' +
                  '<span class="author">' + escapeHtml(m.author) + realNameHtml + '</span>' +
                  '<span class="time">' + formatTime(m.time) + '</span>' +
                '</div>';

    if (m.text){
      inner += '<div class="content">' + escapeHtml(m.text) + '</div>';
    }
    if (m.image){
      inner += '<img src="' + m.image + '" alt="image" data-img="1">';
    }

    // Reactions
    const reactions = m.reactions || {};
    const reactionsHtml = renderReactions(m.id, reactions);

    inner += '<div class="msg-footer">' + reactionsHtml + '</div>';

    div.innerHTML = inner;
    chatBox.appendChild(div);
  });

  // Lightbox
  chatBox.querySelectorAll('img[data-img]').forEach(function(img){
    img.addEventListener('click', function(){
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    });
  });

  // Reaction buttons
  bindReactions();

  if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
  updatePoints();
}

/* ============ REACTIONS ============ */
function renderReactions(msgId, reactions){
  let html = '<div class="reactions-row">';

  // Count reactions per emoji
  const counts = {};
  Object.keys(reactions || {}).forEach(function(emoji){
    const users = reactions[emoji] || [];
    if (users.length > 0){
      counts[emoji] = users;
    }
  });

  Object.keys(counts).forEach(function(emoji){
    const users = counts[emoji];
    const mine = users.indexOf(currentUser) !== -1;
    html += '<button class="reaction-chip' + (mine ? ' mine' : '') + '" ' +
      'data-msg="' + msgId + '" data-emoji="' + emoji + '">' +
      emoji + ' <span class="count">' + users.length + '</span>' +
    '</button>';
  });

  html += '<button class="add-reaction-btn" data-msg="' + msgId + '">+ 😊</button>';
  html += '</div>';

  return html;
}

function bindReactions(){
  // Reaction chips (toggle)
  document.querySelectorAll('.reaction-chip').forEach(function(chip){
    chip.addEventListener('click', async function(){
      const msgId = chip.dataset.msg;
      const emoji = chip.dataset.emoji;
      await toggleReaction(msgId, emoji);
    });
  });

  // Add reaction button
  document.querySelectorAll('.add-reaction-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const msgId = btn.dataset.msg;
      showReactionsPicker(btn, msgId);
    });
  });
}

function showReactionsPicker(anchor, msgId){
  // Remove any existing picker
  document.querySelectorAll('.reactions-picker').forEach(function(p){ p.remove(); });

  const picker = document.createElement('div');
  picker.className = 'reactions-picker show';
  REACTION_EMOJIS.forEach(function(emoji){
    const b = document.createElement('button');
    b.textContent = emoji;
    b.addEventListener('click', function(e){
      e.stopPropagation();
      picker.remove();
      toggleReaction(msgId, emoji);
    });
    picker.appendChild(b);
  });

  // Position
  const rect = anchor.getBoundingClientRect();
  picker.style.position = 'fixed';
  picker.style.top = (rect.top - 50) + 'px';
  picker.style.left = rect.left + 'px';

  document.body.appendChild(picker);

  // Close on outside click
  setTimeout(function(){
    document.addEventListener('click', function closePicker(ev){
      if (!picker.contains(ev.target)){
        picker.remove();
        document.removeEventListener('click', closePicker);
      }
    });
  }, 10);
}

async function toggleReaction(msgId, emoji){
  try {
    const msgRef = doc(db, 'messages', msgId);
    const msgSnap = await getDoc(msgRef);
    if (!msgSnap.exists()) return;

    const data = msgSnap.data();
    const reactions = data.reactions || {};
    const users = reactions[emoji] || [];

    if (users.indexOf(currentUser) !== -1){
      // Remove
      reactions[emoji] = users.filter(function(u){ return u !== currentUser; });
      if (reactions[emoji].length === 0) delete reactions[emoji];
    } else {
      // Add
      reactions[emoji] = users.concat([currentUser]);
    }

    await updateDoc(msgRef, { reactions: reactions });
  } catch(e){
    console.error('Reaction error:', e);
  }
}

/* ============ POINTS ============ */
function updatePoints(){
  const total = totalPoints(allMessages);
  const el = document.getElementById('pointsInfo');
  el.textContent = total + ' / ' + MAX_POINTS + ' points';
  el.classList.remove('warn', 'full');
  if (total >= MAX_POINTS) el.classList.add('full');
  else if (total >= MAX_POINTS * 0.75) el.classList.add('warn');
}

/* ============ UPLOAD TO IMGBB ============ */
async function uploadToImgBB(file){
  const formData = new FormData();
  formData.append('image', file);

  return new Promise(function(resolve, reject){
    const xhr = new XMLHttpRequest();
    xhr.open('POST', IMGBB_UPLOAD_URL + '?key=' + IMGBB_API_KEY);
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300){
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success && res.data){
            resolve({
              url: res.data.url,
              size: res.data.size || file.size,
              name: res.data.title || file.name
            });
          } else {
            reject(new Error('Upload failed'));
          }
        } catch(e){ reject(e); }
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.send(formData);
  });
}

/* ============ SEND MESSAGE ============ */
async function sendMessage(){
  const chatInput = document.getElementById('chatInput');
  const text = chatInput.value.trim();
  if (!text && !pendingImage) return;
  if (text.length > MAX_CHARS){
    alert('⚠ Message too long (' + text.length + '/' + MAX_CHARS + ')');
    return;
  }

  const chatSend = document.getElementById('chatSend');
  chatSend.disabled = true;

  try {
    await addDoc(collection(db, 'messages'), {
      author: currentUser,
      realName: currentRealName || '',
      text: text,
      image: pendingImage ? pendingImage.url : null,
      reactions: {},
      time: Date.now()
    });

    // Trim oldest if over MAX_POINTS
    const total = totalPoints(allMessages);
    if (total > MAX_POINTS && allMessages.length > 1){
      const oldest = allMessages[0];
      if (oldest && oldest.id){
        try { await deleteDoc(doc(db, 'messages', oldest.id)); } catch(e){}
      }
    }

    chatInput.value = '';
    updateCharCounter();
    clearPreview();
  } catch (err){
    console.error(err);
    alert('⚠ Failed to send: ' + err.message);
  }

  chatSend.disabled = false;
}

/* ============ CHAR COUNTER ============ */
function updateCharCounter(){
  const input = document.getElementById('chatInput');
  const el = document.getElementById('charCounter');
  const len = input.value.length;
  el.textContent = len + ' / ' + MAX_CHARS;
  el.classList.remove('warn', 'over');
  if (len > MAX_CHARS) el.classList.add('over');
  else if (len > MAX_CHARS * 0.8) el.classList.add('warn');
}

/* ============ PREVIEW ============ */
function showPreview(url, size){
  pendingImage = { url: url, size: size };
  document.getElementById('previewImg').src = url;
  document.getElementById('previewInfo').textContent =
    'Image ready · ' + (size/1024).toFixed(1) + ' KB · ' + IMG_POINTS + ' pts';
  document.getElementById('previewRow').classList.add('active');
}

function clearPreview(){
  pendingImage = null;
  document.getElementById('previewImg').src = '';
  document.getElementById('previewInfo').textContent = '';
  document.getElementById('previewRow').classList.remove('active');
}

/* ============ EMOJI PICKER ============ */
function initEmojiPicker(){
  const picker = document.getElementById('emojiPicker');
  const btn = document.getElementById('emojiBtn');

  picker.innerHTML = '';
  ALL_EMOJIS.forEach(function(e){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = e;
    b.addEventListener('click', function(){
      const input = document.getElementById('chatInput');
      input.value += e;
      updateCharCounter();
      input.focus();
    });
    picker.appendChild(b);
  });

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    picker.classList.toggle('show');
  });

  document.addEventListener('click', function(e){
    if (!picker.contains(e.target) && e.target !== btn){
      picker.classList.remove('show');
    }
  });
}
initEmojiPicker();

/* ============ EVENT LISTENERS ============ */
document.getElementById('chatSend').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keypress', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});
document.getElementById('chatInput').addEventListener('input', updateCharCounter);
document.getElementById('previewRemove').addEventListener('click', clearPreview);

document.getElementById('chatFileInput').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')){
    alert('⚠ Only images are supported.');
    e.target.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024){
    alert('⚠ Image too large (max 5 MB).');
    e.target.value = '';
    return;
  }

  const btn = document.getElementById('chatSend');
  btn.disabled = true;
  btn.textContent = '◈...';

  try {
    const result = await uploadToImgBB(file);
    showPreview(result.url, result.size);
  } catch(err){
    console.error(err);
    alert('⚠ Upload failed: ' + err.message);
  }

  btn.disabled = false;
  btn.textContent = '▸ Send';
  e.target.value = '';
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    document.getElementById('lightbox').classList.remove('active');
    document.querySelectorAll('.reactions-picker').forEach(function(p){ p.remove(); });
  }
});

window.addEventListener('langChanged', function(){

updateCharCounter();
