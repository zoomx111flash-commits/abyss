<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  :root {
    --bg: #030308;
    --card: rgba(10, 10, 18, 0.65);
    --card-solid: rgba(12, 12, 22, 0.92);
    --border: rgba(255, 30, 60, 0.25);
    --border-hover: rgba(255, 30, 60, 0.65);
    --red: #ff1e3c;
    --red-2: #ff5570;
    --red-glow: rgba(255, 30, 60, 0.6);
    --text: #ebebf5;
    --text-dim: #70707f;
    --text-mute: #3a3a48;
    --success: #00ff88;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 30, 60, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(150, 0, 255, 0.08) 0%, transparent 45%);
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 30, 60, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 30, 60, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.8;
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  #app {
    position: relative;
    z-index: 10;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ============ TOP BAR ============ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.3);
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 15px var(--red-glow);
  }

  .back-btn, .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .back-btn:hover, .logout-btn:hover {
    background: var(--red);
    color: #000;
    border-color: var(--red);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(255, 30, 60, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
  }

  .user-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.2);
    position: relative;
    overflow: hidden;
  }

  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid rgba(255, 30, 60, 0.15);
    flex-wrap: wrap;
  }

  .points-info {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    font-weight: 400;
    text-transform: none;
  }

  .points-info.warn { color: #ffaa00; }
  .points-info.full { color: var(--red); font-weight: 700; animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ============ CHAT BOX ============ */
  .chat-box {
    height: 60vh;
    min-height: 300px;
    overflow-y: auto;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid rgba(255, 30, 60, 0.15);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 30, 60, 0.4) transparent;
  }

  .chat-box::-webkit-scrollbar { width: 8px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb {
    background: rgba(255, 30, 60, 0.3);
    border-radius: 4px;
  }
  .chat-box::-webkit-scrollbar-thumb:hover { background: rgba(255, 30, 60, 0.5); }

  .chat-msg {
    padding: 0.75rem 1rem;
    margin-bottom: 0.65rem;
    background: rgba(255, 30, 60, 0.04);
    border-left: 2px solid var(--red);
    border-radius: 8px;
    font-size: 0.88rem;
    word-break: break-word;
    transition: background 0.2s;
  }

  .chat-msg:hover {
    background: rgba(255, 30, 60, 0.08);
  }

  .chat-msg .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.35rem;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .chat-msg .author {
    color: var(--red);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255, 30, 60, 0.4);
    font-size: 0.85rem;
  }

  .chat-msg .author .realname {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.75rem;
    margin-left: 0.4rem;
  }

  .chat-msg .time {
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
  }

  .chat-msg .content {
    color: var(--text);
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .chat-msg img {
    max-width: 220px;
    max-height: 220px;
    border: 1px solid var(--red);
    border-radius: 8px;
    margin-top: 0.5rem;
    display: block;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .chat-msg img:hover {
    transform: scale(1.02);
  }

  .empty-msg {
    text-align: center;
    color: var(--text-mute);
    padding: 3rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ============ INPUT ROW ============ */
  .chat-input-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
    flex-wrap: wrap;
  }

  .file-btn {
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .file-btn:hover {
    border-color: var(--border-hover);
    color: var(--red);
    background: rgba(255, 30, 60, 0.06);
  }

  .chat-input-row input[type="text"] {
    flex: 1;
    min-width: 150px;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chat-input-row input[type="text"]:focus {
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08);
  }

  .chat-input-row input[type="text"]::placeholder {
    color: var(--text-mute);
    font-weight: 300;
  }

  .chat-input-row button {
    padding: 0.85rem 1.5rem;
    background: linear-gradient(135deg, #ff1e3c 0%, #cc0022 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(255, 30, 60, 0.4);
    white-space: nowrap;
  }

  .chat-input-row button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 25px rgba(255, 30, 60, 0.55);
  }

  .chat-input-row button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .char-counter {
    padding: 0.85rem 0.85rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    align-self: center;
    min-width: 80px;
    text-align: center;
    transition: all 0.2s;
  }

  .char-counter.warn { color: #ffaa00; border-color: rgba(255, 170, 0, 0.4); }
  .char-counter.over { color: var(--red); border-color: var(--red); font-weight: 700; }

  /* ============ IMAGE PREVIEW ============ */
  .preview-row {
    display: none;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    margin-bottom: 0.75rem;
    background: rgba(255, 30, 60, 0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .preview-row.active { display: flex; }

  .preview-row img {
    max-height: 60px;
    max-width: 60px;
    border: 1px solid var(--red);
    border-radius: 8px;
  }

  .preview-row .info {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .preview-row .remove {
    padding: 0.4rem 0.75rem;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .preview-row .remove:hover {
    background: var(--red);
    color: #000;
  }

  /* ============ LIGHTBOX ============ */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0, 0, 0, 0.95);
    align-items: center;
    justify-content: center;
    padding: 2rem;
    flex-direction: column;
    gap: 1.5rem;
  }
  #lightbox.active { display: flex; }

  #lightbox img {
    max-width: 90vw;
    max-height: 80vh;
    border: 2px solid var(--red);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(255, 30, 60, 0.6);
  }

  #lightbox .close-btn {
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #lightbox .close-btn:hover {
    background: var(--red);
    color: #000;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .top-bar { padding: 0.85rem 1rem; }
    .top-bar h2 { font-size: 0.8rem; letter-spacing: 3px; }
    .chat-box { height: 50vh; }
    .chat-input-row input[type="text"] { min-width: 100px; }
    .char-counter { display: none; }
    .chat-input-row button { padding: 0.85rem 1rem; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>

<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <a class="back-btn" href="dashboard.html">← Back</a>
      <h2>◈ General Chat</h2>
    </div>
    <div class="top-bar-right">
      <span class="user-badge" id="userBadge">—</span>
      <button class="logout-btn" id="logoutBtn">⏻ Exit</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>◈ Encrypted Channel</span>
      <span class="points-info" id="pointsInfo">0 / 500 points</span>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="empty-msg">◈ Loading messages... ◈</div>
    </div>

    <div class="preview-row" id="previewRow">
      <img id="previewImg" src="" alt="">
      <div class="info" id="previewInfo"></div>
      <button class="remove" id="previewRemove">✕ Remove</button>
    </div>

    <div class="chat-input-row">
      <label class="file-btn" for="chatFileInput" title="Attach image (10 pts)">📎</label>
      <input type="file" id="chatFileInput" style="display:none" accept="image/*">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" maxlength="350">
      <span class="char-counter" id="charCounter">0 / 350</span>
      <button id="chatSend">▸ Send</button>
    </div>
  </div>
</div>

<div id="lightbox">
  <img id="lightboxImg" src="" alt="">
  <button class="close-btn" onclick="document.getElementById('lightbox').classList.remove('active')">✕ Close</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  deleteDoc, doc, query, orderBy, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ============ IMGBB API KEY ============ */
const IMGBB_API_KEY = "98f875ce16259f1162f59f8da017a85e";
const IMGBB_UPLOAD_URL = "https://api.imgbb.com/1/upload";

/* ============ POINT SYSTEM ============ */
const MAX_POINTS = 500;
const IMG_POINTS = 10;
const EMOJI_POINTS = 5;
const MAX_CHARS = 350;

/* ============ MATRIX RAIN (30 FPS) ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    mctx.fillStyle = Math.random() > 0.985 ? '#ffffff' : '#ff1e3c';
    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ AUTH ============ */
let currentUser = null;
let currentRealName = '';

onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  const stored = sessionStorage.getItem('abyss_user');
  if (stored){
    currentUser = stored;
  } else {
    const emailUser = user.email.split('@')[0];
    currentUser = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
    sessionStorage.setItem('abyss_user', currentUser);
  }

  document.getElementById('userBadge').textContent = currentUser;

  // ✅ جيب الاسم الحقيقي من Firestore
  try {
    const accSnap = await getDoc(doc(db, 'accounts', currentUser));
    if (accSnap.exists() && accSnap.data().realName){
      currentRealName = accSnap.data().realName;
    }
  } catch(e){
    console.error('Failed to load realName:', e);
  }

  // ✅ افحص الحالة (locked / suspended)
  try {
    const statusSnap = await getDoc(doc(db, 'settings', 'global'));
    if (statusSnap.exists()){
      const data = statusSnap.data();
      const isOwner = currentUser.toLowerCase() === 'devil-0';
      if (!isOwner){
        if (data.locked){
          alert('⛓ The Abyss is locked by the creator.');
          await signOut(auth);
          window.location.replace('index.html');
          return;
        }
        if ((data.suspended || []).indexOf(currentUser) !== -1){
          alert('🚫 Your account is suspended.');
          await signOut(auth);
          window.location.replace('index.html');
          return;
        }
      }
    }
  } catch(e){}

  loadMessages();
  setInterval(loadMessages, 3000);
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ HELPERS ============ */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

const EMOJI_REGEX = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F2FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{1F1E0}-\u{1F1FF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;

function countEmojis(str){
  const m = String(str||'').match(EMOJI_REGEX);
  return m ? m.length : 0;
}

function pointsForText(text){
  const t = String(text||'');
  const emojiCount = countEmojis(t);
  return (t.length - emojiCount) * 1 + emojiCount * EMOJI_POINTS;
}

function pointsForMessage(msg){
  let pts = 0;
  if (msg.text) pts += pointsForText(msg.text);
  if (msg.image) pts += IMG_POINTS;
  return pts;
}

function totalPoints(msgs){
  return msgs.reduce(function(s, m){ return s + pointsForMessage(m); }, 0);
}

function formatTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return sameDay ? time : d.toLocaleDateString() + ' · ' + time;
}

/* ============ LOAD MESSAGES ============ */
let allMessages = [];
let isLoadingMessages = false;

async function loadMessages(){
  if (isLoadingMessages) return;
  isLoadingMessages = true;

  try {
    const q = query(collection(db, 'messages'), orderBy('time', 'asc'));
    const snap = await getDocs(q);
    allMessages = [];
    snap.forEach(function(d){
      allMessages.push(Object.assign({ id: d.id }, d.data()));
    });
    renderChat();
  } catch(err){
    console.error('Firestore error:', err);
  }

  isLoadingMessages = false;
}

function renderChat(){
  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';

  if (!allMessages.length){
    chatBox.innerHTML = '<div class="empty-msg">◈ no messages yet — be the first ◈</div>';
    updatePoints();
    return;
  }

  allMessages.forEach(function(m){
    const div = document.createElement('div');
    div.className = 'chat-msg';

    const realNameHtml = m.realName
      ? '<span class="realname">· ' + escapeHtml(m.realName) + '</span>'
      : '';

    let inner = '<div class="header">' +
                  '<span class="author">' + escapeHtml(m.author) + realNameHtml + '</span>' +
                  '<span class="time">' + formatTime(m.time) + '</span>' +
                '</div>';

    if (m.text){
      inner += '<div class="content">' + escapeHtml(m.text) + '</div>';
    }
    if (m.image){
      inner += '<img src="' + m.image + '" alt="image" data-img="1">';
    }
    div.innerHTML = inner;
    chatBox.appendChild(div);
  });

  chatBox.querySelectorAll('img[data-img]').forEach(function(img){
    img.addEventListener('click', function(){
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    });
  });

  chatBox.scrollTop = chatBox.scrollHeight;
  updatePoints();
}

function updatePoints(){
  const total = totalPoints(allMessages);
  const el = document.getElementById('pointsInfo');
  el.textContent = total + ' / ' + MAX_POINTS + ' points';
  el.classList.remove('warn', 'full');
  if (total >= MAX_POINTS) el.classList.add('full');
  else if (total >= MAX_POINTS * 0.75) el.classList.add('warn');
}

/* ============ UPLOAD TO IMGBB ============ */
async function uploadToImgBB(file){
  const formData = new FormData();
  formData.append('image', file);

  return new Promise(function(resolve, reject){
    const xhr = new XMLHttpRequest();
    xhr.open('POST', IMGBB_UPLOAD_URL + '?key=' + IMGBB_API_KEY);
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300){
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success && res.data){
            resolve({
              url: res.data.url,
              size: res.data.size || file.size,
              name: res.data.title || file.name
            });
          } else {
            reject(new Error('Upload failed'));
          }
        } catch(e){ reject(e); }
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.send(formData);
  });
}

/* ============ SEND MESSAGE ============ */
let pendingImage = null;

async function sendMessage(){
  const chatInput = document.getElementById('chatInput');
  const text = chatInput.value.trim();
  if (!text && !pendingImage) return;
  if (text.length > MAX_CHARS){
    alert('⚠ Message too long (' + text.length + '/' + MAX_CHARS + ')');
    return;
  }

  const chatSend = document.getElementById('chatSend');
  chatSend.disabled = true;

  try {
    await addDoc(collection(db, 'messages'), {
      author: currentUser,
      realName: currentRealName || '',
      text: text,
      image: pendingImage ? pendingImage.url : null,
      time: Date.now()
    });

    // Trim oldest if over MAX_POINTS
    const total = totalPoints(allMessages);
    if (total > MAX_POINTS && allMessages.length > 1){
      const oldest = allMessages[0];
      if (oldest && oldest.id){
        try { await deleteDoc(doc(db, 'messages', oldest.id)); } catch(e){}
      }
    }

    chatInput.value = '';
    updateCharCounter();
    clearPreview();
    await loadMessages();
  } catch (err){
    console.error(err);
    alert('⚠ Failed to send: ' + err.message);
  }

  chatSend.disabled = false;
}

/* ============ CHAR COUNTER ============ */
function updateCharCounter(){
  const input = document.getElementById('chatInput');
  const el = document.getElementById('charCounter');
  const len = input.value.length;
  el.textContent = len + ' / ' + MAX_CHARS;
  el.classList.remove('warn', 'over');
  if (len > MAX_CHARS) el.classList.add('over');
  else if (len > MAX_CHARS * 0.8) el.classList.add('warn');
}

/* ============ PREVIEW ============ */
function showPreview(url, size){
  pendingImage = { url: url, size: size };
  document.getElementById('previewImg').src = url;
  document.getElementById('previewInfo').textContent =
    'Image ready · ' + (size/1024).toFixed(1) + ' KB · costs ' + IMG_POINTS + ' pts';
  document.getElementById('previewRow').classList.add('active');
}

function clearPreview(){
  pendingImage = null;
  document.getElementById('previewImg').src = '';
  document.getElementById('previewInfo').textContent = '';
  document.getElementById('previewRow').classList.remove('active');
}

/* ============ EVENT LISTENERS ============ */
document.getElementById('chatSend').addEventListener('click', sendMessage);

document.getElementById('chatInput').addEventListener('keypress', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});

document.getElementById('chatInput').addEventListener('input', updateCharCounter);

document.getElementById('previewRemove').addEventListener('click', clearPreview);

document.getElementById('chatFileInput').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')){
    alert('⚠ Only images are supported.');
    e.target.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024){
    alert('⚠ Image too large (max 5 MB).');
    e.target.value = '';
    return;
  }

  const btn = document.getElementById('chatSend');
  btn.disabled = true;
  btn.textContent = '◈ Uploading...';

  try {
    const result = await uploadToImgBB(file);
    showPreview(result.url, result.size);
  } catch(err){
    console.error(err);
    alert('⚠ Upload failed: ' + err.message);
  }

  btn.disabled = false;
  btn.textContent = '▸ Send';
  e.target.value = '';
});

// ESC to close lightbox
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    document.getElementById('lightbox').classList.remove('active');
  }
});

updateCharCounter();
</script>
