<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABYSS · SETUP</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: 'Courier New', monospace; }
  body { background: #000; color: #ff6666; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: rgba(10,0,0,0.9); border: 1px solid #ff0000;
    border-radius: 20px; padding: 2rem 1.5rem; max-width: 500px; width: 100%;
    box-shadow: 0 0 40px rgba(255,0,0,0.5); text-align: center; }
  h1 { color: #ff1a1a; letter-spacing: 4px; margin-bottom: 1rem;
    text-shadow: 0 0 15px #ff0000; font-size: 1.3rem; }
  p { color: #ff9999; font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.5rem; }
  button { padding: 1rem 2rem; font-size: 0.9rem; font-weight: 700;
    border: none; border-radius: 8px; background: #8b0000; color: #fff;
    cursor: pointer; letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255,0,0,0.6); transition: all 0.2s;
    font-family: inherit; }
  button:hover { background: #ff0000; box-shadow: 0 0 40px #ff0000; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .log { margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.6);
    border: 1px solid #4d0000; border-radius: 8px; text-align: left;
    font-size: 0.75rem; max-height: 300px; overflow-y: auto;
    color: #ffcccc; line-height: 1.7; }
  .log .ok { color: #00ff88; }
  .log .err { color: #ff4444; }
</style>
</head>
<body>
<div class="card">
  <h1>🔧 ABYSS SETUP</h1>
  <p>
    هذا الملف ينشئ الحسابات الستة في Firebase Auth.<br>
    <strong style="color:#ff1a1a;">استخدمه مرة واحدة فقط ثم احذفه.</strong>
  </p>
  <button id="btn">▸ إنشاء الحسابات</button>
  <div class="log" id="log" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ⚠️ نفس قائمة الحسابات
const ACCOUNTS = [
  { id: "Devil-0", pass: "140333" },
  { id: "Devil-1", pass: "717171" },
  { id: "Devil-2", pass: "606062" },
  { id: "Devil-3", pass: "515152" },
  { id: "Devil-4", pass: "312312" },
  { id: "Devil-5", pass: "123321" }
];

function email(id){ return id.toLowerCase() + "@abyss.local"; }

function log(msg, cls){
  const el = document.getElementById('log');
  el.style.display = 'block';
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

document.getElementById('btn').addEventListener('click', async function(){
  this.disabled = true;
  log('◈ بدء إنشاء الحسابات...');

  for (const acc of ACCOUNTS){
    try {
      await createUserWithEmailAndPassword(auth, email(acc.id), acc.pass);
      log('✓ تم إنشاء ' + acc.id, 'ok');
    } catch (e) {
      if (e.code === 'auth/email-already-in-use'){
        log('ℹ ' + acc.id + ' موجود مسبقاً', 'ok');
      } else {
        log('✗ خطأ في ' + acc.id + ': ' + e.message, 'err');
      }
    }
  }

  // حفظ الأسماء في Firestore
  try {
    for (const acc of ACCOUNTS){
      await setDoc(doc(db, 'accounts', acc.id), {
        username: acc.id,
        realName: '',
        createdAt: Date.now()
      });
    }
    log('✓ تم إنشاء سجلات Firestore', 'ok');
  } catch (e) {
    log('✗ خطأ Firestore: ' + e.message, 'err');
  }

  log('◈ اكتمل! يمكنك حذف هذا الملف الآن.');
  log('◈ اذهب إلى index.html لتسجيل الدخول.');

  // سجّل خروج
  try { await auth.signOut(); } catch(e){}
});
</script>
</body>
</html>
