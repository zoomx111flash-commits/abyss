<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · COMMAND CENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  :root {
    --bg: #030308;
    --card: rgba(10, 10, 18, 0.65);
    --card-solid: rgba(12, 12, 22, 0.92);
    --border: rgba(255, 30, 60, 0.25);
    --border-hover: rgba(255, 30, 60, 0.65);
    --red: #ff1e3c;
    --red-2: #ff5570;
    --red-glow: rgba(255, 30, 60, 0.6);
    --text: #ebebf5;
    --text-dim: #70707f;
    --text-mute: #3a3a48;
    --success: #00ff88;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    /* ✅ خلفية ثابتة بدون animations دائمة */
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 30, 60, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(150, 0, 255, 0.08) 0%, transparent 45%);
  }

  /* ✅ طبقة واحدة بدل 5 طبقات */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 30, 60, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 30, 60, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.8;
  }

  /* ✅ Canvas واحد فقط للـ matrix */
  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  /* Cursor glow — بدون RAF دائم */
  .cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 30, 60, 0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    opacity: 0;
    filter: blur(30px);
    will-change: transform;
  }
  .cursor-glow.active { opacity: 1; }

  /* ============ APP ============ */
  #app {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    display: none;
  }
  #app.active { display: block; }

  /* ============ HEADER ============ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.3);
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }
  .top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 15px var(--red-glow);
  }

  .back-btn, .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .back-btn:hover, .logout-btn:hover {
    background: var(--red);
    color: #000;
    border-color: var(--red);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(0, 255, 136, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--success);
    transition: all 0.3s;
  }
  .status-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .status-pill.locked {
    border-color: var(--red);
    background: rgba(255, 30, 60, 0.15);
    color: var(--red);
  }
  .status-pill.locked::before {
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.2);
    position: relative;
    overflow: hidden;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid rgba(255, 30, 60, 0.15);
  }

  /* ============ COMMAND BUTTONS ============ */
  .cmd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.85rem;
  }

  .cmd-btn {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 1.1rem 1.25rem;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    color: var(--text);
    transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .cmd-btn:hover {
    transform: translateX(4px);
    border-color: var(--border-hover);
    background: rgba(255, 30, 60, 0.06);
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.15);
  }

  .cmd-btn.danger:hover {
    background: rgba(255, 30, 60, 0.1);
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.3);
  }

  .cmd-btn.success:hover {
    background: rgba(0, 255, 136, 0.06);
    border-color: rgba(0, 255, 136, 0.6);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
  }

  .cmd-btn .ico {
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .cmd-btn .txt {
    flex: 1;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .cmd-btn .txt small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 0.25rem;
    text-transform: none;
  }

  /* ============ USER LIST ============ */
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.85rem 1.15rem;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
    flex-wrap: wrap;
  }

  .user-row:hover {
    border-color: var(--border-hover);
  }

  .user-row.owner {
    border-color: var(--red);
    background: rgba(255, 30, 60, 0.06);
    box-shadow: 0 0 20px rgba(255, 30, 60, 0.2);
  }

  .user-row.suspended {
    border-color: rgba(255, 170, 0, 0.5);
    background: rgba(255, 170, 0, 0.05);
  }

  .user-row .u-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--red);
    min-width: 110px;
  }

  .user-row.owner .u-name::after {
    content: ' ★';
    color: var(--success);
  }

  .user-row.suspended .u-name {
    color: #ffaa00;
  }

  .user-row .u-real {
    flex: 1;
    font-size: 0.82rem;
    color: var(--text);
    min-width: 100px;
  }

  .user-row .u-real.empty {
    color: var(--text-mute);
    font-style: italic;
  }

  .user-row .u-kick {
    padding: 0.45rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .user-row .u-kick:hover {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  .user-row .u-kick.owner {
    color: var(--success);
    border-color: rgba(0, 255, 136, 0.4);
    background: rgba(0, 255, 136, 0.05);
    cursor: not-allowed;
    opacity: 0.85;
  }

  .user-row.suspended .u-kick {
    color: var(--success);
    border-color: rgba(0, 255, 136, 0.4);
  }

  .user-row.suspended .u-kick:hover {
    background: var(--success);
    color: #000;
    border-color: var(--success);
  }

  /* ============ MODAL ============ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-bg.active { display: flex; }

  .modal {
    width: 100%;
    max-width: 440px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 32px 80px -20px rgba(255, 30, 60, 0.4);
    position: relative;
    overflow: hidden;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .modal h3 {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    text-align: center;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 15px var(--red-glow);
  }

  .modal p {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.6;
    text-align: center;
  }

  .modal label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
    margin-top: 1rem;
  }

  .modal label::before {
    content: '› ';
    color: var(--red);
    font-weight: 700;
  }

  .modal input, .modal select {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid rgba(255, 30, 60, 0.2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .modal input:focus, .modal select:focus {
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08);
  }

  .modal-btns {
    display: flex;
    gap: 0.65rem;
    margin-top: 1.75rem;
  }

  .modal-btns button {
    flex: 1;
    padding: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .modal-btns .ok {
    background: linear-gradient(135deg, #ff1e3c 0%, #cc0022 100%);
    color: #fff;
    border: 1px solid var(--red);
  }
  .modal-btns .ok:hover {
    background: #ff1e3c;
  }

  .modal-btns .cancel {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .modal-btns .cancel:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 0.9rem 1.75rem;
    background: var(--card-solid);
    border: 1px solid var(--red);
    border-radius: 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 500;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.5);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success {
    border-color: var(--success);
    color: var(--success);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
  }
  .status-pill.locked { border-color: var(--red); background: rgba(255,30,60,0.15); color: var(--red); }
  .status-pill.locked::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* ============ GATE ============ */
  #gateView {
    position: fixed; inset: 0;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  #gateView.hidden { display: none; }

  .gate-card {
    width: 100%; max-width: 420px;
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 32px 80px -25px rgba(255, 30, 60, 0.4);
  }
  .gate-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red) 50%, transparent);
  }

  .gate-icon {
    font-size: 3.5rem; margin-bottom: 1.25rem; display: block;
    filter: drop-shadow(0 0 25px var(--red));
  }
  .gate-title {
    font-size: 1.1rem; font-weight: 900;
    letter-spacing: 6px; text-transform: uppercase;
    color: var(--red); margin-bottom: 0.5rem;
  }
  .gate-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 2rem;
  }
  .gate-input {
    width: 100%; padding: 1.15rem;
    background: rgba(5, 5, 12, 0.7);
    border: 1px solid rgba(255, 30, 60, 0.2);
    border-radius: 12px; color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.75rem; font-weight: 700;
    text-align: center; letter-spacing: 12px;
    outline: none; margin-bottom: 1.25rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .gate-input:focus {
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08);
  }
  .gate-btn {
    width: 100%; padding: 1.05rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: #fff; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff1e3c 0%, #cc0022 100%);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(255, 30, 60, 0.45);
  }
  .gate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(255, 30, 60, 0.6); }
  .gate-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .gate-msg {
    margin-top: 1.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; min-height: 1.5rem;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-12px); }
    30% { transform: translateX(12px); }
    45% { transform: translateX(-8px); }
    60% { transform: translateX(8px); }
    80% { transform: translateX(-4px); }
  }
  .shake { animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .top-bar { padding: 0.85rem 1rem; }
    .top-bar h2 { font-size: 0.8rem; letter-spacing: 3px; }
    .cmd-grid { grid-template-columns: 1fr; }
    .user-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
    .user-row .u-name { min-width: auto; }
    .user-row .u-kick { width: 100%; }
    .gate-card { padding: 2.25rem 1.5rem; }
    .gate-input { font-size: 1.5rem; letter-spacing: 8px; }
    .cursor-glow { display: none; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>

<!-- GATE -->
<div id="gateView">
  <div class="gate-card" id="gateCard">
    <span class="gate-icon">🔒</span>
    <div class="gate-title">Restricted</div>
    <div class="gate-sub">Enter command code</div>
    <input type="password" id="gateInput" class="gate-input"
      placeholder="••••" maxlength="8" autocomplete="off"
      inputmode="numeric" spellcheck="false">
    <button class="gate-btn" id="gateBtn" type="button">▸ Unlock</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <a class="back-btn" href="dashboard.html">← Back</a>
      <h2>◈ Command Center</h2>
    </div>
    <div class="top-bar-right">
      <span class="status-pill" id="lockStatus">● Active</span>
      <button class="logout-btn" id="logoutBtn">⏻ Exit</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔒 Master Commands</div>
    <div class="cmd-grid">
      <button class="cmd-btn danger" id="cmdWipeChat">
        <span class="ico">🗑</span>
        <span class="txt">Wipe Entire Chat<small>delete all chat messages</small></span>
      </button>
      <button class="cmd-btn danger" id="cmdLockAbyss">
        <span class="ico">⛓</span>
        <span class="txt">Lock The Abyss<small>block everyone (except Devil-0)</small></span>
      </button>
      <button class="cmd-btn success" id="cmdUnlockAbyss">
        <span class="ico">🔓</span>
        <span class="txt">Unlock The Abyss<small>allow everyone back in</small></span>
      </button>
      <button class="cmd-btn danger" id="cmdSuspendUser">
        <span class="ico">🚫</span>
        <span class="txt">Suspend User<small>hide all sections from user</small></span>
      </button>
      <button class="cmd-btn success" id="cmdUnsuspendUser">
        <span class="ico">↩</span>
        <span class="txt">Unsuspend User<small>restore a suspended user</small></span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">👤 Operators Registry</div>
    <div class="user-list" id="userList"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, deleteDoc, doc,
  setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

/* ============ CURSOR GLOW — بدون RAF دائم ============ */
const cursorGlow = document.getElementById('cursorGlow');
let rafPending = false;

document.addEventListener('mousemove', function(e){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    cursorGlow.style.transform = 'translate(' + (e.clientX - 200) + 'px, ' + (e.clientY - 200) + 'px)';
    cursorGlow.classList.add('active');
    rafPending = false;
  });
}, { passive: true });

document.addEventListener('mouseleave', function(){
  cursorGlow.classList.remove('active');
});

/* ============ MATRIX RAIN — 30 FPS ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops, matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30; // 30 FPS

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    if (Math.random() > 0.985){
      mctx.fillStyle = '#ffffff';
    } else {
      mctx.fillStyle = '#ff1e3c';
    }

    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975){
      matrixDrops[i] = 0;
    }
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ TOAST ============ */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg, type){
  toast.textContent = msg;
  toast.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.className = (type || ''); }, 2500);
}

/* ============ AUTH ============ */
let currentUser = null;

onAuthStateChanged(auth, function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }
  const stored = sessionStorage.getItem('abyss_user');
  if (stored){
    currentUser = stored;
  } else {
    const emailUser = user.email.split('@')[0];
    currentUser = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  sessionStorage.removeItem('abyss_admin_unlocked');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ GATE ============ */
const gateView = document.getElementById('gateView');
const gateCard = document.getElementById('gateCard');
const gateInput = document.getElementById('gateInput');
const gateBtn = document.getElementById('gateBtn');
const gateMsg = document.getElementById('gateMsg');
const appEl = document.getElementById('app');

function shakeGate(){
  gateCard.classList.add('shake');
  setTimeout(function(){ gateCard.classList.remove('shake'); }, 550);
}

function unlockApp(){
  gateView.classList.add('hidden');
  appEl.classList.add('active');
  sessionStorage.setItem('abyss_admin_unlocked', 'ok');
  refreshAll();
}

async function tryUnlock(){
  const code = gateInput.value.trim();
  if (!code){
    gateMsg.style.color = '#ff1e3c';
    gateMsg.textContent = '✕ Enter the code';
    shakeGate();
    return;
  }

  gateBtn.disabled = true;
  gateMsg.style.color = '#70707f';
  gateMsg.textContent = '◈ Verifying...';

  let correctCode = null;
  try {
    const snap = await getDoc(doc(db, 'settings', 'config'));
    if (snap.exists()){
      correctCode = snap.data().adminCode;
    }
  } catch(e){
    console.error('Failed to read adminCode:', e);
  }

  setTimeout(function(){
    gateBtn.disabled = false;

    if (correctCode && code === String(correctCode)){
      gateMsg.style.color = '#00ff88';
      gateMsg.textContent = '✓ Access granted';
      setTimeout(unlockApp, 300);
    } else {
      gateMsg.style.color = '#ff1e3c';
      gateMsg.textContent = '✕ Invalid command code';
      gateInput.value = '';
      shakeGate();
      setTimeout(function(){ gateInput.focus(); }, 200);
    }
  }, 250);
}

gateBtn.addEventListener('click', tryUnlock);
gateInput.addEventListener('keypress', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); tryUnlock(); }
});

if (sessionStorage.getItem('abyss_admin_unlocked') === 'ok'){
  setTimeout(unlockApp, 100);
} else {
  setTimeout(function(){ gateInput.focus(); }, 300);
}

/* ============ SETTINGS ============ */
async function loadSettings(){
  try {
    const snap = await getDoc(doc(db, 'settings', 'global'));
    if (snap.exists()) return snap.data();
    return { locked: false, suspended: [] };
  } catch (e){
    console.error(e);
    return { locked: false, suspended: [] };
  }
}

async function saveSettings(data){
  try {
    await setDoc(doc(db, 'settings', 'global'), data);
  } catch (e){
    console.error(e);
  }
}

/* ============ REFRESH ============ */
const lockStatus = document.getElementById('lockStatus');
const userList = document.getElementById('userList');

async function refreshAll(){
  const settings = await loadSettings();

  if (settings.locked){
    lockStatus.textContent = '⛓ Locked';
    lockStatus.classList.add('locked');
  } else {
    lockStatus.textContent = '● Active';
    lockStatus.classList.remove('locked');
  }

  try {
    const snap = await getDocs(collection(db, 'accounts'));
    userList.innerHTML = '';
    const suspended = settings.suspended || [];

    const users = [];
    snap.forEach(function(d){
      const data = d.data();
      users.push({ id: d.id, username: data.username || d.id, realName: data.realName || '' });
    });

    users.sort(function(a, b){
      if (a.username.toLowerCase() === ADMIN_USER.toLowerCase()) return -1;
      if (b.username.toLowerCase() === ADMIN_USER.toLowerCase()) return 1;
      return a.username.localeCompare(b.username);
    });

    users.forEach(function(u){
      const k = u.username;
      const isOwner = k.toLowerCase() === ADMIN_USER.toLowerCase();
      const isSuspended = suspended.indexOf(k) !== -1;

      const row = document.createElement('div');
      row.className = 'user-row';
      if (isOwner) row.classList.add('owner');
      if (isSuspended) row.classList.add('suspended');

      const nameEl = document.createElement('div');
      nameEl.className = 'u-name';
      nameEl.textContent = k;

      const realEl = document.createElement('div');
      realEl.className = 'u-real' + (u.realName ? '' : ' empty');
      realEl.textContent = u.realName || 'no name set';

      const kickBtn = document.createElement('button');
      kickBtn.className = 'u-kick';

      if (isOwner){
        kickBtn.textContent = 'Owner';
        kickBtn.classList.add('owner');
        kickBtn.disabled = true;
      } else {
        kickBtn.textContent = isSuspended ? '↩ Unsuspend' : '🚫 Suspend';
        kickBtn.addEventListener('click', (function(userK){
          return async function(){
            const s = await loadSettings();
            const arr = s.suspended || [];
            if (arr.indexOf(userK) !== -1){
              s.suspended = arr.filter(function(x){ return x !== userK; });
              await saveSettings(s);
              showToast(userK + ' unsuspended', 'success');
            } else {
              s.suspended = arr.concat([userK]);
              await saveSettings(s);
              showToast(userK + ' suspended', 'error');
            }
            await refreshAll();
          };
        })(k));
      }

      row.appendChild(nameEl);
      row.appendChild(realEl);
      row.appendChild(kickBtn);
      userList.appendChild(row);
    });

    if (!users.length){
      userList.innerHTML = '<div style="text-align:center;color:#3a3a48;padding:1.5rem;letter-spacing:2px;font-size:0.75rem;text-transform:uppercase;">No operators yet</div>';
    }
  } catch (e){
    console.error(e);
    showToast('Failed to load users', 'error');
  }
}

/* ============ MODAL ============ */
const modalBg = document.getElementById('modalBg');
const modalContent = document.getElementById('modalContent');
function openModal(html){
  modalContent.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal(){
  modalBg.classList.remove('active');
  modalContent.innerHTML = '';
}
modalBg.addEventListener('click', function(e){
  if (e.target === modalBg) closeModal();
});

/* ============ COMMANDS ============ */

// Wipe chat
document.getElementById('cmdWipeChat').addEventListener('click', function(){
  openModal(
    '<h3>⚠ Wipe Entire Chat</h3>' +
    '<p style="color:#ebebf5;font-size:0.85rem;line-height:1.6;">' +
    'This will delete ALL chat messages permanently.</p>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">Cancel</button>' +
    '<button class="ok" id="confirmWipe">🗑 Wipe</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmWipe').addEventListener('click', async function(){
    try {
      const snap = await getDocs(collection(db, 'messages'));
      const promises = [];
      snap.forEach(function(d){
        promises.push(deleteDoc(doc(db, 'messages', d.id)));
      });
      await Promise.all(promises);
      closeModal();
      showToast('Chat wiped', 'success');
    } catch (e){
      console.error(e);
      showToast('Failed: ' + e.message, 'error');
    }
  });
});

// Lock abyss
document.getElementById('cmdLockAbyss').addEventListener('click', function(){
  openModal(
    '<h3>⛓ Lock The Abyss</h3>' +
    '<p style="color:#ebebf5;font-size:0.85rem;line-height:1.6;">' +
    'Everyone except <b style="color:#ff1e3c;">Devil-0</b> will be locked out.</p>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">Cancel</button>' +
    '<button class="ok" id="confirmLock">⛓ Lock</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmLock').addEventListener('click', async function(){
    const s = await loadSettings();
    s.locked = true;
    await saveSettings(s);
    closeModal();
    await refreshAll();
    showToast('The Abyss is now LOCKED', 'error');
  });
});

// Unlock abyss
document.getElementById('cmdUnlockAbyss').addEventListener('click', async function(){
  const s = await loadSettings();
  s.locked = false;
  await saveSettings(s);
  await refreshAll();
  showToast('The Abyss is now OPEN', 'success');
});

// Suspend user
document.getElementById('cmdSuspendUser').addEventListener('click', async function(){
  const snap = await getDocs(collection(db, 'accounts'));
  const settings = await loadSettings();
  const suspended = settings.suspended || [];

  const avail = [];
  snap.forEach(function(d){
    const k = d.data().username || d.id;
    if (k.toLowerCase() !== ADMIN_USER.toLowerCase() && suspended.indexOf(k) === -1){
      avail.push(k);
    }
  });

  if (!avail.length){
    showToast('No users to suspend', 'error');
    return;
  }

  const options = avail.map(function(u){
    return '<option value="' + u + '">' + u + '</option>';
  }).join('');

  openModal(
    '<h3>🚫 Suspend User</h3>' +
    '<label>Select Operator</label>' +
    '<select id="suspendUser">' + options + '</select>' +
    '<p style="color:#3a3a48;font-size:0.72rem;margin-top:1rem;line-height:1.6;">' +
    'Suspended users can log in but see NO sections.</p>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">Cancel</button>' +
    '<button class="ok" id="confirmSuspend">🚫 Suspend</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmSuspend').addEventListener('click', async function(){
    const u = document.getElementById('suspendUser').value;
    const s = await loadSettings();
    const arr = s.suspended || [];
    if (arr.indexOf(u) === -1) s.suspended = arr.concat([u]);
    await saveSettings(s);
    closeModal();
    await refreshAll();
    showToast(u + ' suspended', 'error');
  });
});

// Unsuspend user
document.getElementById('cmdUnsuspendUser').addEventListener('click', async function(){
  const s = await loadSettings();
  const suspended = s.suspended || [];
  if (!suspended.length){
    showToast('No suspended users', 'error');
    return;
  }

  const options = suspended.map(function(u){
    return '<option value="' + u + '">' + u + '</option>';
  }).join('');

  openModal(
    '<h3>↩ Unsuspend User</h3>' +
    '<label>Select Suspended Operator</label>' +
    '<select id="unsuspendUser">' + options + '</select>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">Cancel</button>' +
    '<button class="ok" id="confirmUnsuspend">↩ Unsuspend</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmUnsuspend').addEventListener('click', async function(){
    const u = document.getElementById('unsuspendUser').value;
    const s2 = await loadSettings();
    s2.suspended = (s2.suspended || []).filter(function(x){ return x !== u; });
    await saveSettings(s2);
    closeModal();
    await refreshAll();
    showToast(u + ' unsuspended', 'success');
  });
});
</script>
