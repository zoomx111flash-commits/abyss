<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · COMMAND CENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  body {
    background: var(--bg, #030308);
    color: var(--text, #ebebf5);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    transition: background 0.4s, color 0.4s;
    background-image:
      radial-gradient(circle at 15% 20%, var(--primary-glow, rgba(255,30,60,0.12)) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--primary-glow, rgba(255,30,60,0.08)) 0%, transparent 45%);
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px),
      linear-gradient(90deg, var(--border, rgba(255,30,60,0.04)) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.6;
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  /* ============ GATE ============ */
  #gateView {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #gateView.hidden { display: none; }

  .gate-card {
    width: 100%;
    max-width: 420px;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 24px;
    padding: 3rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 32px 80px -25px var(--primary-glow, rgba(255,30,60,0.4));
  }

  .gate-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c) 50%, transparent);
  }

  .gate-icon {
    font-size: 3.5rem;
    margin-bottom: 1.25rem;
    display: block;
    filter: drop-shadow(0 0 25px var(--primary, #ff1e3c));
  }

  .gate-title {
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    margin-bottom: 0.5rem;
  }

  .gate-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim, #70707f);
    margin-bottom: 2rem;
  }

  .gate-input {
    width: 100%;
    padding: 1.15rem;
    background: rgba(5, 5, 12, 0.7);
    border: 1px solid var(--border, rgba(255,30,60,0.2));
    border-radius: 12px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.75rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: 12px;
    outline: none;
    transition: all 0.3s;
    margin-bottom: 1.25rem;
  }
  .gate-input:focus {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    box-shadow: 0 0 0 3px var(--primary-glow, rgba(255,30,60,0.1));
  }

  .gate-btn {
    width: 100%;
    padding: 1.05rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary, #ff1e3c) 0%, var(--primary-2, #cc0022) 100%);
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 24px var(--primary-glow, rgba(255,30,60,0.45));
  }
  .gate-btn:hover { transform: translateY(-2px); }
  .gate-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .gate-msg {
    margin-top: 1.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    min-height: 1.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim, #70707f);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-12px); }
    30% { transform: translateX(12px); }
    45% { transform: translateX(-8px); }
    60% { transform: translateX(8px); }
    80% { transform: translateX(-4px); }
  }
  .shake { animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  /* ============ APP ============ */
  #app {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    display: none;
  }
  #app.active { display: block; }

  /* ============ TOP BAR ============ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.3));
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text, #ebebf5);
    text-shadow: 0 0 15px var(--primary-glow, rgba(255,30,60,0.6));
  }

  .back-btn, .icon-btn, .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim, #70707f);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .icon-btn { width: 40px; justify-content: center; padding: 0.5rem; }

  .back-btn:hover, .icon-btn:hover, .logout-btn:hover {
    background: var(--primary, #ff1e3c);
    color: #000;
    border-color: var(--primary, #ff1e3c);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    background: rgba(0, 255, 136, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--success, #00ff88);
    transition: all 0.3s;
  }
  .status-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success, #00ff88);
    box-shadow: 0 0 8px var(--success, #00ff88);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .status-pill.locked {
    border-color: var(--primary, #ff1e3c);
    background: rgba(255, 30, 60, 0.15);
    color: var(--primary, #ff1e3c);
  }
  .status-pill.locked::before {
    background: var(--primary, #ff1e3c);
    box-shadow: 0 0 8px var(--primary, #ff1e3c);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--card, rgba(10,10,18,0.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 20px 60px -20px var(--primary-glow, rgba(255,30,60,0.2));
    position: relative;
    overflow: hidden;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    font-weight: 700;
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--border, rgba(255,30,60,0.15));
  }

  /* ============ COMMAND BUTTONS ============ */
  .cmd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.85rem;
  }

  .cmd-btn {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 1.1rem 1.25rem;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    color: var(--text, #ebebf5);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .cmd-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 0;
    background: var(--primary, #ff1e3c);
    transition: height 0.3s;
  }

  [dir="rtl"] .cmd-btn::before { left: auto; right: 0; }

  .cmd-btn:hover::before { height: 100%; }

  .cmd-btn:hover {
    transform: translateX(4px);
    border-color: var(--border-hover, rgba(255,30,60,0.65));
    background: rgba(255, 30, 60, 0.06);
    box-shadow: 0 0 30px var(--primary-glow, rgba(255,30,60,0.15));
  }

  [dir="rtl"] .cmd-btn:hover { transform: translateX(-4px); }

  .cmd-btn.danger { border-color: rgba(255, 30, 60, 0.4); }
  .cmd-btn.danger:hover { background: rgba(255, 30, 60, 0.1); }

  .cmd-btn.success { border-color: rgba(0, 255, 136, 0.3); }
  .cmd-btn.success:hover {
    background: rgba(0, 255, 136, 0.06);
    border-color: rgba(0, 255, 136, 0.6);
  }
  .cmd-btn.success::before { background: var(--success, #00ff88); }

  .cmd-btn .ico {
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .cmd-btn .txt {
    flex: 1;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .cmd-btn .txt small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--text-dim, #70707f);
    margin-top: 0.25rem;
    text-transform: none;
  }

  /* ============ USER LIST ============ */
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.85rem 1.15rem;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 12px;
    transition: all 0.25s;
    flex-wrap: wrap;
  }

  .user-row:hover {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
  }

  .user-row.owner {
    border-color: var(--primary, #ff1e3c);
    background: rgba(255, 30, 60, 0.06);
    box-shadow: 0 0 20px var(--primary-glow, rgba(255,30,60,0.2));
  }

  .user-row.suspended {
    border-color: rgba(255, 170, 0, 0.5);
    background: rgba(255, 170, 0, 0.05);
  }

  .user-row .u-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--primary, #ff1e3c);
    min-width: 110px;
  }

  .user-row.owner .u-name::after {
    content: ' ★';
    color: var(--success, #00ff88);
  }

  .user-row.suspended .u-name {
    color: #ffaa00;
  }

  .user-row .u-real {
    flex: 1;
    font-size: 0.82rem;
    color: var(--text, #ebebf5);
    min-width: 100px;
  }

  .user-row .u-real.empty {
    color: var(--text-mute, #3a3a48);
    font-style: italic;
  }

  .user-row .u-kick {
    padding: 0.45rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    color: var(--text-dim, #70707f);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .user-row .u-kick:hover {
    background: var(--primary, #ff1e3c);
    color: #fff;
    border-color: var(--primary, #ff1e3c);
  }

  .user-row .u-kick.owner {
    color: var(--success, #00ff88);
    border-color: rgba(0, 255, 136, 0.4);
    background: rgba(0, 255, 136, 0.05);
    cursor: not-allowed;
    opacity: 0.85;
  }

  .user-row.suspended .u-kick {
    color: var(--success, #00ff88);
    border-color: rgba(0, 255, 136, 0.4);
  }

  .user-row.suspended .u-kick:hover {
    background: var(--success, #00ff88);
    color: #000;
  }

  /* ============ MODAL ============ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-bg.active { display: flex; }

  .modal {
    width: 100%;
    max-width: 440px;
    background: var(--card-solid, rgba(12,12,22,0.92));
    border: 1px solid var(--border, rgba(255,30,60,0.25));
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 32px 80px -20px var(--primary-glow, rgba(255,30,60,0.4));
    position: relative;
    overflow: hidden;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary, #ff1e3c), transparent);
  }

  .modal h3 {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--primary, #ff1e3c);
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .modal p {
    font-size: 0.85rem;
    color: var(--text, #ebebf5);
    line-height: 1.6;
    text-align: center;
  }

  .modal label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim, #70707f);
    margin-bottom: 0.4rem;
    margin-top: 1rem;
  }

  .modal label::before {
    content: '› ';
    color: var(--primary, #ff1e3c);
    font-weight: 700;
  }

  .modal input, .modal select {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid var(--border, rgba(255,30,60,0.2));
    border-radius: 10px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .modal input:focus, .modal select:focus {
    border-color: var(--border-hover, rgba(255,30,60,0.65));
  }

  .modal-btns {
    display: flex;
    gap: 0.65rem;
    margin-top: 1.75rem;
  }

  .modal-btns button {
    flex: 1;
    padding: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-btns .ok {
    background: linear-gradient(135deg, var(--primary, #ff1e3c) 0%, var(--primary-2, #cc0022) 100%);
    color: #fff;
    border: 1px solid var(--primary, #ff1e3c);
  }
  .modal-btns .ok:hover { transform: translateY(-2px); }

  .modal-btns .cancel {
    background: transparent;
    color: var(--text-dim, #70707f);
    border: 1px solid var(--border, rgba(255,30,60,0.25));
  }
  .modal-btns .cancel:hover {
    border-color: var(--primary, #ff1e3c);
    color: var(--primary, #ff1e3c);
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 0.9rem 1.75rem;
    background: var(--card-solid, rgba(12,12,22,0.92));
    border: 1px solid var(--primary, #ff1e3c);
    border-radius: 12px;
    color: var(--text, #ebebf5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 500;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 30px var(--primary-glow, rgba(255,30,60,0.5));
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success {
    border-color: var(--success, #00ff88);
    color: var(--success, #00ff88);
  }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .top-bar { padding: 0.85rem 1rem; }
    .top-bar h2 { font-size: 0.8rem; letter-spacing: 3px; }
    .cmd-grid { grid-template-columns: 1fr; }
    .user-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
    .user-row .u-name { min-width: auto; }
    .user-row .u-kick { width: 100%; }
    .gate-card { padding: 2.25rem 1.5rem; }
    .gate-input { font-size: 1.5rem; letter-spacing: 8px; }
  }

  [dir="rtl"] .top-bar-left { flex-direction: row-reverse; }
  [dir="rtl"] .top-bar-right { flex-direction: row-reverse; }
  [dir="rtl"] .card-title { flex-direction: row-reverse; }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>

<!-- GATE -->
<div id="gateView">
  <div class="gate-card" id="gateCard">
    <span class="gate-icon">🔒</span>
    <div class="gate-title" data-i18n="admin.restricted">Restricted</div>
    <div class="gate-sub" data-i18n="admin.enter_code">Enter command code</div>
    <input type="password" id="gateInput" class="gate-input"
      placeholder="••••" maxlength="8" autocomplete="off"
      inputmode="numeric" spellcheck="false">
    <button class="gate-btn" id="gateBtn" type="button">
      <span data-i18n="admin.unlock">▸ Unlock</span>
    </button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <a class="back-btn" href="dashboard.html">← <span data-i18n="common.back">Back</span></a>
      <h2 data-i18n="admin.title">Command Center</h2>
    </div>
    <div class="top-bar-right">
      <span class="status-pill" id="lockStatus">● <span data-i18n="admin.active">Active</span></span>
      <a class="icon-btn" href="settings.html" title="Settings">⚙</a>
      <button class="logout-btn" id="logoutBtn">⏻ <span data-i18n="dash.exit">Exit</span></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔒 <span data-i18n="admin.master">Master Commands</span></div>
    <div class="cmd-grid">
      <button class="cmd-btn danger" id="cmdWipeChat">
        <span class="ico">🗑</span>
        <span class="txt">
          <span data-i18n="admin.wipe">Wipe Entire Chat</span>
          <small data-i18n="admin.wipe_desc">delete all chat messages</small>
        </span>
      </button>
      <button class="cmd-btn danger" id="cmdLockAbyss">
        <span class="ico">⛓</span>
        <span class="txt">
          <span data-i18n="admin.lock">Lock The Abyss</span>
          <small data-i18n="admin.lock_desc">block everyone except Devil-0</small>
        </span>
      </button>
      <button class="cmd-btn success" id="cmdUnlockAbyss">
        <span class="ico">🔓</span>
        <span class="txt">
          <span data-i18n="admin.unlock_abyss">Unlock The Abyss</span>
          <small data-i18n="admin.unlock_desc">allow everyone back in</small>
        </span>
      </button>
      <button class="cmd-btn danger" id="cmdSuspendUser">
        <span class="ico">🚫</span>
        <span class="txt">
          <span data-i18n="admin.suspend">Suspend User</span>
          <small data-i18n="admin.suspend_desc">hide all sections from user</small>
        </span>
      </button>
      <button class="cmd-btn success" id="cmdUnsuspendUser">
        <span class="ico">↩</span>
        <span class="txt">
          <span data-i18n="admin.unsuspend">Unsuspend User</span>
          <small data-i18n="admin.unsuspend_desc">restore a suspended user</small>
        </span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">👤 <span data-i18n="admin.registry">Operators Registry</span></div>
    <div class="user-list" id="userList"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<div id="toast"></div>

<script src="lang.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, deleteDoc, doc,
  setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

let currentUser = null;

/* ============ MATRIX RAIN ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  const theme = window.AbyssTheme ? window.AbyssTheme.get() : 'abyss';
  const primaryColors = {
    abyss: '#ff1e3c',
    matrix: '#00ff41',
    ice: '#00c8ff',
    void: '#b400ff',
    stealth: '#a0a0a0'
  };
  const color = primaryColors[theme] || '#ff1e3c';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    mctx.fillStyle = Math.random() > 0.985 ? '#ffffff' : color;
    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ TOAST ============ */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg, type){
  toast.textContent = msg;
  toast.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.className = (type || ''); }, 2500);
}

/* ============ AUTH ============ */
onAuthStateChanged(auth, function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }
  const stored = sessionStorage.getItem('abyss_user');
  if (stored){
    currentUser = stored;
  } else {
    const emailUser = user.email.split('@')[0];
    currentUser = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  sessionStorage.removeItem('abyss_admin_unlocked');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ GATE ============ */
const gateView = document.getElementById('gateView');
const gateCard = document.getElementById('gateCard');
const gateInput = document.getElementById('gateInput');
const gateBtn = document.getElementById('gateBtn');
const gateMsg = document.getElementById('gateMsg');
const appEl = document.getElementById('app');

function shakeGate(){
  gateCard.classList.add('shake');
  setTimeout(function(){ gateCard.classList.remove('shake'); }, 550);
}

function unlockApp(){
  gateView.classList.add('hidden');
  appEl.classList.add('active');
  sessionStorage.setItem('abyss_admin_unlocked', 'ok');
  refreshAll();
}

async function tryUnlock(){
  const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };
  const code = gateInput.value.trim();
  if (!code){
    gateMsg.style.color = 'var(--primary, #ff1e3c)';
    gateMsg.textContent = '✕ ' + (t('admin.enter_code') || 'Enter the code');
    shakeGate();
    return;
  }

  gateBtn.disabled = true;
  gateMsg.style.color = 'var(--text-dim, #70707f)';
  gateMsg.textContent = '◈ ' + (t('admin.verifying') || 'Verifying...');

  let correctCode = null;
  try {
    const snap = await getDoc(doc(db, 'settings', 'config'));
    if (snap.exists()){
      correctCode = snap.data().adminCode;
    }
  } catch(e){
    console.error('Failed to read adminCode:', e);
  }

  setTimeout(function(){
    gateBtn.disabled = false;

    if (correctCode && code === String(correctCode)){
      gateMsg.style.color = 'var(--success, #00ff88)';
      gateMsg.textContent = '✓ ' + (t('admin.granted') || 'Access granted');
      setTimeout(unlockApp, 300);
    } else {
      gateMsg.style.color = 'var(--primary, #ff1e3c)';
      gateMsg.textContent = '✕ ' + (t('admin.invalid_code') || 'Invalid code');
      gateInput.value = '';
      shakeGate();
      setTimeout(function(){ gateInput.focus(); }, 200);
    }
  }, 250);
}

gateBtn.addEventListener('click', tryUnlock);
gateInput.addEventListener('keypress', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); tryUnlock(); }
});

if (sessionStorage.getItem('abyss_admin_unlocked') === 'ok'){
  setTimeout(unlockApp, 100);
} else {
  setTimeout(function(){ gateInput.focus(); }, 300);
}

/* ============ SETTINGS ============ */
async function loadSettings(){
  try {
    const snap = await getDoc(doc(db, 'settings', 'global'));
    if (snap.exists()) return snap.data();
    return { locked: false, suspended: [] };
  } catch (e){
    console.error(e);
    return { locked: false, suspended: [] };
  }
}

async function saveSettings(data){
  try {
    await setDoc(doc(db, 'settings', 'global'), data);
  } catch (e){
    console.error(e);
  }
}

/* ============ REFRESH ============ */
const lockStatus = document.getElementById('lockStatus');
const userList = document.getElementById('userList');

async function refreshAll(){
  const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };
  const settings = await loadSettings();

  if (settings.locked){
    lockStatus.innerHTML = '⛓ <span>' + (t('admin.locked') || 'Locked') + '</span>';
    lockStatus.classList.add('locked');
  } else {
    lockStatus.innerHTML = '● <span>' + (t('admin.active') || 'Active') + '</span>';
    lockStatus.classList.remove('locked');
  }

  try {
    const snap = await getDocs(collection(db, 'accounts'));
    userList.innerHTML = '';
    const suspended = settings.suspended || [];

    const users = [];
    snap.forEach(function(d){
      const data = d.data();
      users.push({ id: d.id, username: data.username || d.id, realName: data.realName || '' });
    });

    users.sort(function(a, b){
      if (a.username.toLowerCase() === ADMIN_USER.toLowerCase()) return -1;
      if (b.username.toLowerCase() === ADMIN_USER.toLowerCase()) return 1;
      return a.username.localeCompare(b.username);
    });

    users.forEach(function(u){
      const k = u.username;
      const isOwner = k.toLowerCase() === ADMIN_USER.toLowerCase();
      const isSuspended = suspended.indexOf(k) !== -1;

      const row = document.createElement('div');
      row.className = 'user-row';
      if (isOwner) row.classList.add('owner');
      if (isSuspended) row.classList.add('suspended');

      const nameEl = document.createElement('div');
      nameEl.className = 'u-name';
      nameEl.textContent = k;

      const realEl = document.createElement('div');
      realEl.className = 'u-real' + (u.realName ? '' : ' empty');
      realEl.textContent = u.realName || '—';

      const kickBtn = document.createElement('button');
      kickBtn.className = 'u-kick';

      if (isOwner){
        kickBtn.textContent = t('admin.owner') || 'Owner';
        kickBtn.classList.add('owner');
        kickBtn.disabled = true;
      } else {
        kickBtn.textContent = isSuspended
          ? '↩ ' + (t('admin.unsuspend') || 'Unsuspend')
          : '🚫 ' + (t('admin.suspend') || 'Suspend');
        kickBtn.addEventListener('click', (function(userK){
          return async function(){
            const s = await loadSettings();
            const arr = s.suspended || [];
            if (arr.indexOf(userK) !== -1){
              s.suspended = arr.filter(function(x){ return x !== userK; });
              await saveSettings(s);
              showToast('✓ ' + userK, 'success');
            } else {
              s.suspended = arr.concat([userK]);
              await saveSettings(s);
              showToast('🚫 ' + userK, 'error');
            }
            await refreshAll();
          };
        })(k));
      }

      row.appendChild(nameEl);
      row.appendChild(realEl);
      row.appendChild(kickBtn);
      userList.appendChild(row);
    });

    if (!users.length){
      userList.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:1.5rem;letter-spacing:2px;font-size:0.75rem;text-transform:uppercase;">no operators</div>';
    }
  } catch (e){
    console.error(e);
  }
}

/* ============ MODAL ============ */
const modalBg = document.getElementById('modalBg');
const modalContent = document.getElementById('modalContent');
function openModal(html){
  modalContent.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal(){
  modalBg.classList.remove('active');
  modalContent.innerHTML = '';
}
modalBg.addEventListener('click', function(e){
  if (e.target === modalBg) closeModal();
});

/* ============ COMMANDS ============ */
const t = window.AbyssLang ? window.AbyssLang.t : function(k){ return k; };

// Wipe chat
document.getElementById('cmdWipeChat').addEventListener('click', function(){
  openModal(
    '<h3>' + (t('admin.wipe') || 'Wipe Entire Chat') + '</h3>' +
    '<p>This will delete ALL chat messages permanently.</p>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">' + (t('admin.cancel') || 'Cancel') + '</button>' +
    '<button class="ok" id="confirmWipe">🗑 ' + (t('admin.confirm') || 'Confirm') + '</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmWipe').addEventListener('click', async function(){
    try {
      const snap = await getDocs(collection(db, 'messages'));
      const promises = [];
      snap.forEach(function(d){
        promises.push(deleteDoc(doc(db, 'messages', d.id)));
      });
      await Promise.all(promises);
      closeModal();
      showToast('✓ Chat wiped', 'success');
    } catch (e){
      showToast('✗ Failed', 'error');
    }
  });
});

// Lock
document.getElementById('cmdLockAbyss').addEventListener('click', function(){
  openModal(
    '<h3>⛓ ' + (t('admin.lock') || 'Lock The Abyss') + '</h3>' +
    '<p>Everyone except <b style="color:var(--primary)">Devil-0</b> will be locked out.</p>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">' + (t('admin.cancel') || 'Cancel') + '</button>' +
    '<button class="ok" id="confirmLock">⛓ ' + (t('admin.confirm') || 'Confirm') + '</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmLock').addEventListener('click', async function(){
    const s = await loadSettings();
    s.locked = true;
    await saveSettings(s);
    closeModal();
    await refreshAll();
    showToast('⛓ Locked', 'error');
  });
});

// Unlock
document.getElementById('cmdUnlockAbyss').addEventListener('click', async function(){
  const s = await loadSettings();
  s.locked = false;
  await saveSettings(s);
  await refreshAll();
  showToast('🔓 Unlocked', 'success');
});

// Suspend
document.getElementById('cmdSuspendUser').addEventListener('click', async function(){
  const snap = await getDocs(collection(db, 'accounts'));
  const settings = await loadSettings();
  const suspended = settings.suspended || [];

  const avail = [];
  snap.forEach(function(d){
    const k = d.data().username || d.id;
    if (k.toLowerCase() !== ADMIN_USER.toLowerCase() && suspended.indexOf(k) === -1){
      avail.push(k);
    }
  });

  if (!avail.length){
    showToast('No users to suspend', 'error');
    return;
  }

  const options = avail.map(function(u){
    return '<option value="' + u + '">' + u + '</option>';
  }).join('');

  openModal(
    '<h3>🚫 ' + (t('admin.suspend') || 'Suspend User') + '</h3>' +
    '<label>' + (t('admin.select_op') || 'Select Operator') + '</label>' +
    '<select id="suspendUser">' + options + '</select>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">' + (t('admin.cancel') || 'Cancel') + '</button>' +
    '<button class="ok" id="confirmSuspend">🚫 ' + (t('admin.confirm') || 'Confirm') + '</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmSuspend').addEventListener('click', async function(){
    const u = document.getElementById('suspendUser').value;
    const s = await loadSettings();
    const arr = s.suspended || [];
    if (arr.indexOf(u) === -1) s.suspended = arr.concat([u]);
    await saveSettings(s);
    closeModal();
    await refreshAll();
    showToast('🚫 ' + u, 'error');
  });
});

// Unsuspend
document.getElementById('cmdUnsuspendUser').addEventListener('click', async function(){
  const s = await loadSettings();
  const suspended = s.suspended || [];
  if (!suspended.length){
    showToast('No suspended users', 'error');
    return;
  }

  const options = suspended.map(function(u){
    return '<option value="' + u + '">' + u + '</option>';
  }).join('');

  openModal(
    '<h3>↩ ' + (t('admin.unsuspend') || 'Unsuspend User') + '</h3>' +
    '<label>' + (t('admin.select_op') || 'Select Operator') + '</label>' +
    '<select id="unsuspendUser">' + options + '</select>' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">' + (t('admin.cancel') || 'Cancel') + '</button>' +
    '<button class="ok" id="confirmUnsuspend">↩ ' + (t('admin.confirm') || 'Confirm') + '</button>' +
    '</div>'
  );
  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('confirmUnsuspend').addEventListener('click', async function(){
    const u = document.getElementById('unsuspendUser').value;
    const s2 = await loadSettings();
    s2.suspended = (s2.suspended || []).filter(function(x){ return x !== u; });
    await saveSettings(s2);
    closeModal();
    await refreshAll();
    showToast('✓ ' + u + ' restored', 'success');
  });
});

/* ============ REACT TO LANGUAGE ============ */
window.addEventListener('langChanged', function(){
  refreshAll();
});
</script>
</body>
</html>
