<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · ACCOUNTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }

  :root {
    --bg: #030308;
    --card: rgba(10, 10, 18, 0.65);
    --card-solid: rgba(12, 12, 22, 0.92);
    --border: rgba(255, 30, 60, 0.25);
    --border-hover: rgba(255, 30, 60, 0.65);
    --red: #ff1e3c;
    --red-2: #ff5570;
    --red-glow: rgba(255, 30, 60, 0.6);
    --text: #ebebf5;
    --text-dim: #70707f;
    --text-mute: #3a3a48;
    --success: #00ff88;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 1.5rem;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 30, 60, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(150, 0, 255, 0.08) 0%, transparent 45%);
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 30, 60, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 30, 60, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    opacity: 0.8;
  }

  #matrixCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  #app {
    position: relative;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ============ TOP BAR ============ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.3);
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    animation: topLine 5s linear infinite;
  }
  @keyframes topLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 15px var(--red-glow);
  }

  .back-btn, .logout-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .back-btn:hover, .logout-btn:hover {
    background: var(--red);
    color: #000;
    border-color: var(--red);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(255, 30, 60, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
  }

  .user-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  .user-badge.admin {
    background: rgba(255, 30, 60, 0.2);
    border-color: var(--red);
  }

  .user-badge.admin::before {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px -20px rgba(255, 30, 60, 0.2);
    position: relative;
    overflow: hidden;
  }

  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid rgba(255, 30, 60, 0.15);
    flex-wrap: wrap;
  }

  .count-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.75rem;
    background: rgba(255, 30, 60, 0.08);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    font-weight: 400;
    text-transform: none;
  }

  /* ============ USER LIST ============ */
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    background: rgba(5, 5, 12, 0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.25s;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
  }

  .user-row::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 0;
    background: var(--red);
    transition: height 0.3s;
  }

  .user-row:hover::before { height: 100%; }

  .user-row:hover {
    border-color: var(--border-hover);
    background: rgba(255, 30, 60, 0.04);
    box-shadow: 0 0 25px rgba(255, 30, 60, 0.15);
  }

  .user-row.owner {
    border-color: var(--red);
    background: rgba(255, 30, 60, 0.06);
    box-shadow: 0 0 25px rgba(255, 30, 60, 0.2);
  }

  .user-row.owner::before {
    background: var(--success);
  }

  .user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, rgba(255, 30, 60, 0.15), rgba(255, 30, 60, 0.05));
    border: 1px solid var(--border);
    color: var(--red);
    flex-shrink: 0;
    text-shadow: 0 0 10px var(--red-glow);
  }

  .user-row.owner .user-avatar {
    border-color: var(--success);
    color: var(--success);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
  }

  .user-details {
    flex: 1;
    min-width: 150px;
  }

  .user-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 0.3rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .user-row.owner .user-name {
    color: var(--success);
  }

  .user-name .crown {
    font-size: 0.85rem;
    filter: drop-shadow(0 0 5px var(--success));
  }

  .user-real {
    font-size: 0.82rem;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .user-real.empty {
    color: var(--text-mute);
    font-style: italic;
  }

  .user-actions {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .user-edit {
    padding: 0.5rem 1.1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .user-edit:hover {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
  }

  .user-edit.locked {
    color: var(--text-mute);
    border-color: rgba(255, 30, 60, 0.1);
    cursor: not-allowed;
  }

  .user-edit.locked:hover {
    background: transparent;
    color: var(--text-mute);
    border-color: rgba(255, 30, 60, 0.1);
    box-shadow: none;
  }

  .empty-msg {
    text-align: center;
    color: var(--text-mute);
    padding: 3rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ============ MODAL ============ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-bg.active { display: flex; }

  .modal {
    width: 100%;
    max-width: 440px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 32px 80px -20px rgba(255, 30, 60, 0.4);
    position: relative;
    overflow: hidden;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .modal h3 {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    text-align: center;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 15px var(--red-glow);
  }

  .modal label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
    margin-top: 1rem;
  }

  .modal label::before {
    content: '› ';
    color: var(--red);
    font-weight: 700;
  }

  .modal input {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(5, 5, 12, 0.6);
    border: 1px solid rgba(255, 30, 60, 0.2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .modal input:focus {
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.08);
  }

  .modal input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .modal input::placeholder {
    color: var(--text-mute);
    font-weight: 300;
  }

  .modal-btns {
    display: flex;
    gap: 0.65rem;
    margin-top: 1.75rem;
  }

  .modal-btns button {
    flex: 1;
    padding: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-btns .ok {
    background: linear-gradient(135deg, #ff1e3c 0%, #cc0022 100%);
    color: #fff;
    border: 1px solid var(--red);
    box-shadow: 0 4px 20px rgba(255, 30, 60, 0.4);
  }
  .modal-btns .ok:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255, 30, 60, 0.6);
  }
  .modal-btns .ok:disabled {
    opacity: 0.5;
    cursor: wait;
    transform: none;
  }

  .modal-btns .cancel {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .modal-btns .cancel:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 0.9rem 1.75rem;
    background: var(--card-solid);
    border: 1px solid var(--red);
    border-radius: 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 500;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.5);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success {
    border-color: var(--success);
    color: var(--success);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
  }
  #toast.error {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 30px rgba(255, 30, 60, 0.5);
  }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .top-bar { padding: 0.85rem 1rem; }
    .top-bar h2 { font-size: 0.8rem; letter-spacing: 3px; }
    .user-row { flex-direction: column; align-items: stretch; gap: 0.85rem; }
    .user-avatar { width: 38px; height: 38px; font-size: 1rem; }
    .user-actions { justify-content: flex-end; }
    .user-edit { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>

<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <a class="back-btn" href="dashboard.html">← Back</a>
      <h2>◈ Account Registry</h2>
    </div>
    <div class="top-bar-right">
      <span class="user-badge" id="userBadge">—</span>
      <button class="logout-btn" id="logoutBtn">⏻ Exit</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>👤 Operators</span>
      <span class="count-badge" id="countBadge">0 accounts</span>
    </div>
    <div class="user-list" id="userList">
      <div class="empty-msg">◈ Loading operators... ◈</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc,
  setDoc, updateDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZbzltfXXt39cGeNYhrgfQCyd770xSq9g",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_USER = "Devil-0";

/* ============ MATRIX RAIN (30 FPS) ============ */
const mc = document.getElementById('matrixCanvas');
const mctx = mc.getContext('2d');
let mcWidth, mcHeight, matrixCols, matrixDrops;
const matrixFontSize = 16;
const matrixChars = 'アカサタナハマヤラワ0123456789ABCDEF';

function initMatrix(){
  mcWidth = mc.width = innerWidth;
  mcHeight = mc.height = innerHeight;
  matrixCols = Math.floor(mcWidth / matrixFontSize);
  matrixDrops = new Array(matrixCols).fill(1);
}
initMatrix();

let resizeTimer;
addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMatrix, 200);
});

let lastMatrixTime = 0;
const MATRIX_INTERVAL = 1000 / 30;

function drawMatrix(now){
  requestAnimationFrame(drawMatrix);
  if (document.hidden) return;
  if (now - lastMatrixTime < MATRIX_INTERVAL) return;
  lastMatrixTime = now;

  mctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
  mctx.fillRect(0, 0, mcWidth, mcHeight);
  mctx.font = matrixFontSize + 'px JetBrains Mono, monospace';

  for (let i = 0; i < matrixDrops.length; i++){
    const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * matrixFontSize;
    const y = matrixDrops[i] * matrixFontSize;

    mctx.fillStyle = Math.random() > 0.985 ? '#ffffff' : '#ff1e3c';
    mctx.fillText(text, x, y);

    if (y > mcHeight && Math.random() > 0.975) matrixDrops[i] = 0;
    matrixDrops[i]++;
  }
}
requestAnimationFrame(drawMatrix);

/* ============ TOAST ============ */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg, type){
  toast.textContent = msg;
  toast.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.className = (type || ''); }, 2500);
}

/* ============ AUTH ============ */
let currentUser = null;
let isAdmin = false;

onAuthStateChanged(auth, async function(user){
  if (!user){
    window.location.replace('index.html');
    return;
  }

  let stored = sessionStorage.getItem('abyss_user');
  if (!stored && user.email){
    const emailUser = user.email.split('@')[0];
    stored = emailUser.charAt(0).toUpperCase() + emailUser.slice(1);
  }
  currentUser = stored || 'unknown';
  isAdmin = (currentUser.toLowerCase() === ADMIN_USER.toLowerCase());

  const badge = document.getElementById('userBadge');
  badge.textContent = currentUser + (isAdmin ? ' ★' : '');
  if (isAdmin) badge.classList.add('admin');

  await refreshAll();
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  sessionStorage.removeItem('abyss_user');
  await signOut(auth);
  window.location.replace('index.html');
});

/* ============ REFRESH ============ */
async function refreshAll(){
  try {
    const snap = await getDocs(collection(db, 'accounts'));
    const userList = document.getElementById('userList');
    userList.innerHTML = '';

    const accounts = [];
    snap.forEach(function(d){
      const data = d.data();
      accounts.push({
        id: d.id,
        username: data.username || d.id,
        realName: data.realName || ''
      });
    });

    // Sort: Devil-0 first, then by number
    accounts.sort(function(a, b){
      if (a.username.toLowerCase() === ADMIN_USER.toLowerCase()) return -1;
      if (b.username.toLowerCase() === ADMIN_USER.toLowerCase()) return 1;
      return a.username.localeCompare(b.username);
    });

    document.getElementById('countBadge').textContent =
      accounts.length + ' account' + (accounts.length === 1 ? '' : 's');

    if (!accounts.length){
      userList.innerHTML = '<div class="empty-msg">◈ No operators found ◈</div>';
      return;
    }

    accounts.forEach(function(acc){
      const isOwner = acc.username.toLowerCase() === ADMIN_USER.toLowerCase();

      const row = document.createElement('div');
      row.className = 'user-row';
      if (isOwner) row.classList.add('owner');

      // Avatar with first letter
      const avatar = document.createElement('div');
      avatar.className = 'user-avatar';
      avatar.textContent = acc.username.charAt(0).toUpperCase();

      // Details
      const details = document.createElement('div');
      details.className = 'user-details';

      const nameEl = document.createElement('div');
      nameEl.className = 'user-name';
      nameEl.innerHTML = escapeHtml(acc.username) +
        (isOwner ? '<span class="crown">★</span>' : '');

      const realEl = document.createElement('div');
      realEl.className = 'user-real' + (acc.realName ? '' : ' empty');
      realEl.textContent = acc.realName || '(no name set)';

      details.appendChild(nameEl);
      details.appendChild(realEl);

      // Actions
      const actions = document.createElement('div');
      actions.className = 'user-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'user-edit';

      if (isAdmin){
        editBtn.textContent = acc.realName ? '✎ Edit' : '✎ Set';
        editBtn.addEventListener('click', function(){
          openEditModal(acc);
        });
      } else {
        editBtn.textContent = '🔒 View';
        editBtn.classList.add('locked');
        editBtn.disabled = true;
      }

      actions.appendChild(editBtn);

      row.appendChild(avatar);
      row.appendChild(details);
      row.appendChild(actions);
      userList.appendChild(row);
    });
  } catch (e){
    console.error(e);
    document.getElementById('userList').innerHTML =
      '<div class="empty-msg">⚠ Failed to load operators</div>';
  }
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ============ MODAL ============ */
const modalBg = document.getElementById('modalBg');
const modalContent = document.getElementById('modalContent');

function openModal(html){
  modalContent.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal(){
  modalBg.classList.remove('active');
  modalContent.innerHTML = '';
}
modalBg.addEventListener('click', function(e){
  if (e.target === modalBg) closeModal();
});

function openEditModal(acc){
  openModal(
    '<h3>✎ Set Real Name</h3>' +
    '<label>Operator</label>' +
    '<input type="text" value="' + escapeHtml(acc.username) + '" disabled>' +
    '<label>Real Name</label>' +
    '<input type="text" id="realNameInput" placeholder="e.g. محمد" ' +
      'value="' + escapeHtml(acc.realName) + '" autocomplete="off" maxlength="30" spellcheck="false">' +
    '<div class="modal-btns">' +
    '<button class="cancel" id="mxCancel">Cancel</button>' +
    '<button class="ok" id="mxSave">💾 Save</button>' +
    '</div>'
  );

  document.getElementById('mxCancel').addEventListener('click', closeModal);
  document.getElementById('mxSave').addEventListener('click', async function(){
    const btn = this;
    const newName = document.getElementById('realNameInput').value.trim();

    btn.disabled = true;
    btn.textContent = '◈ Saving...';

    await saveRealName(acc.id, newName);

    closeModal();
    await refreshAll();
    showToast('✓ Name updated for ' + acc.username, 'success');
  });

  setTimeout(function(){
    const inp = document.getElementById('realNameInput');
    if (inp) inp.focus();
  }, 100);
}

async function saveRealName(accountId, name){
  try {
    const ref = doc(db, 'accounts', accountId);
    const snap = await getDoc(ref);
    if (snap.exists()){
      await updateDoc(ref, { realName: name });
    } else {
      await setDoc(ref, {
        username: accountId,
        realName: name,
        createdAt: Date.now()
      });
    }
  } catch (e){
    console.error(e);
    showToast('Failed: ' + e.message, 'error');
  }
}
</script>
