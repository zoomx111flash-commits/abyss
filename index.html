<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABYSS · LOGIN</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: 'Courier New', monospace; }
  body { background: #000; color: #ff6666; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    overflow: hidden; }
  #matrixCanvas { position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; opacity: 0.3; pointer-events: none; }
  body::before { content: ''; position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(255,0,0,0.1) 0%, rgba(0,0,0,0.95) 70%);
    z-index: 1; pointer-events: none; }
  .login-card { position: relative; z-index: 2;
    background: rgba(10,0,0,0.9); backdrop-filter: blur(15px);
    border-radius: 20px; padding: 2rem 1.5rem; width: 100%; max-width: 420px;
    border: 1px solid #ff0000;
    box-shadow: 0 0 30px rgba(255,0,0,0.4), 0 0 60px rgba(255,0,0,0.2);
    animation: cardFloat 4s ease-in-out infinite; }
  @keyframes cardFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); box-shadow: 0 0 45px rgba(255,0,0,0.7); }
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}
    40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)} }
  .shake { animation: shake 0.5s ease-in-out; }
  .terminal-header { display: flex; align-items: center; gap: 8px;
    margin-bottom: 1.2rem; padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(255,0,0,0.3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .dot.red { background: #ff0000; color: #ff0000; }
  .dot.yellow { background: #ffaa00; color: #ffaa00; }
  .dot.green { background: #00ff44; color: #00ff44; }
  .terminal-title { margin-left: auto; font-size: 0.65rem; color: #ff6666;
    letter-spacing: 2px; text-transform: uppercase; }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 4px;
    color: #ff1a1a; text-align: center; margin-bottom: 0.4rem;
    text-shadow: 0 0 10px #ff0000; }
  .subtitle { text-align: center; font-size: 0.65rem; color: #991111;
    letter-spacing: 3px; margin-bottom: 1.5rem; text-transform: uppercase; }
  .input-group { margin-bottom: 1rem; }
  label { display: block; font-size: 0.65rem; color: #ff6666;
    margin-bottom: 0.4rem; letter-spacing: 2px; text-transform: uppercase; }
  .input-wrapper { display: flex; align-items: center;
    background: rgba(20,0,0,0.9); border-radius: 8px;
    border: 1px solid #4d0000; transition: all 0.3s; }
  .input-wrapper:focus-within { border-color: #ff0000;
    box-shadow: 0 0 15px rgba(255,0,0,0.6); }
  .input-wrapper input { width: 100%; background: transparent;
    border: none; padding: 0.8rem 1rem; font-size: 0.9rem;
    color: #ffcccc; outline: none; font-family: inherit;
    letter-spacing: 1px; }
  .input-wrapper input::placeholder { color: #551111; }
  button.primary { width: 100%; padding: 0.9rem; font-size: 0.9rem;
    font-weight: 700; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #8b0000, #ff0000, #8b0000);
    background-size: 200% 200%; color: white; cursor: pointer;
    letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255,0,0,0.6);
    transition: all 0.3s; margin-top: 1.2rem;
    animation: gradientShift 3s ease infinite;
    font-family: inherit; }
  @keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  button.primary:hover { box-shadow: 0 0 40px rgba(255,0,0,1); }
  button.primary:disabled { opacity: 0.5; cursor: wait; }
  .message-area { margin-top: 1.2rem; padding: 0.9rem;
    border-radius: 8px; background: rgba(0,0,0,0.7);
    font-size: 0.75rem; text-align: center; color: #ff9999;
    border: 1px solid #4d0000; min-height: 3rem;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 1px; }
  .message-area.success { border-color: #00ff44;
    background: rgba(0,30,10,0.5); color: #00ff88;
    box-shadow: 0 0 20px rgba(0,255,68,0.5); }
  .message-area.error { border-color: #ff0000;
    background: rgba(40,0,0,0.5); color: #ff4444;
    box-shadow: 0 0 20px rgba(255,0,0,0.5); }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<div class="login-card" id="loginCard">
  <div class="terminal-header">
    <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    <span class="terminal-title">secure_shell v4</span>
  </div>
  <h1>Abyss</h1>
  <div class="subtitle">Hidden Network</div>

  <form id="loginForm" onsubmit="return false;">
    <div class="input-group">
      <label>› Operator ID</label>
      <div class="input-wrapper">
        <input type="text" id="loginUser" placeholder="Devil-0" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="input-group">
      <label>› Passphrase</label>
      <div class="input-wrapper">
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <button type="submit" class="primary" id="loginBtn">▸ Authenticate</button>
  </form>
  <div id="loginMsg" class="message-area">◈ awaiting credentials ◈</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFbzXgjiYqrizFNhd9sePmk04NQd0vZDQ",
  authDomain: "storage-for-devil-abyss.firebaseapp.com",
  projectId: "storage-for-devil-abyss",
  storageBucket: "storage-for-devil-abyss.firebasestorage.app",
  messagingSenderId: "45419287364",
  appId: "1:45419287364:web:a81c0b6e133326eece7d11"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function email(id){ return id.toLowerCase() + "@abyss.local"; }

const form = document.getElementById('loginForm');
const userInput = document.getElementById('loginUser');
const passInput = document.getElementById('loginPass');
const btn = document.getElementById('loginBtn');
const msg = document.getElementById('loginMsg');
const card = document.getElementById('loginCard');

function setMsg(t, type){
  msg.textContent = t;
  msg.className = 'message-area ' + (type || '');
}
function shake(){
  card.classList.add('shake');
  setTimeout(function(){ card.classList.remove('shake'); }, 500);
}

// Matrix BG
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);
const chars = 'アカサタナハマヤラワ0123456789ABCDEF';
const fs = 14;
const drops = Array(Math.floor(canvas.width / fs)).fill(1);
setInterval(function(){
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#ff0000';
  ctx.font = fs + 'px monospace';
  for (var i=0;i<drops.length;i++){
    var t = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(t, i*fs, drops[i]*fs);
    if (drops[i]*fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}, 50);

// Auto-redirect if already logged in
onAuthStateChanged(auth, function(user){
  if (user){
    sessionStorage.setItem('abyss_user', user.email.split('@')[0]);
    window.location.replace('dashboard.html');
  }
});

form.addEventListener('submit', async function(e){
  e.preventDefault();
  var u = userInput.value.trim();
  var p = passInput.value;
  if (!u || !p){ setMsg('⚠ credentials required', 'error'); shake(); return; }

  btn.disabled = true;
  setMsg('◈ decrypting...', 'info');

  try {
    var cred = await signInWithEmailAndPassword(auth, email(u), p);
    sessionStorage.setItem('abyss_user', u);
    setMsg('✓ access granted — entering...', 'success');
    setTimeout(function(){
      window.location.replace('dashboard.html');
    }, 500);
  } catch (err){
    console.error(err);
    var msgText = '✕ invalid credentials';
    if (err.code === 'auth/user-not-found') msgText = '✕ unknown operator';
    if (err.code === 'auth/wrong-password') msgText = '✕ invalid passphrase';
    if (err.code === 'auth/too-many-requests') msgText = '⚠ too many attempts — wait';
    if (err.code === 'auth/invalid-email') msgText = '✕ invalid operator id';
    setMsg(msgText, 'error');
    shake();
    btn.disabled = false;
  }
});

[userInput, passInput].forEach(function(i){
  i.addEventListener('keypress', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); form.dispatchEvent(new Event('submit')); }
  });
});
</script>
</body>
</html>
